            category: ''
            message: Thiếu Authorization header
          - code: '4102'
            category: ''
            message: Bearer Token không hợp lệ / hết hạn
          - code: '4108'
            category: ''
            message: IP không được phép
        '403':
          - code: '4103'
            category: ''
            message: Client không có scope=admin
        '404':
          - code: '6001'
            category: ''
            message: Không tìm thấy đơn hàng MULTI_DOMAIN/FLEX đang active cho account này.
          - code: '6004'
            category: ''
            message: Không tìm thấy cấu hình SAN_TOPUP product/mapping cho provider của đơn hàng.
        '409':
          - code: '4090'
            category: ''
            message: Idempotency-Key đang xử lý (concurrent)
          - code: '4091'
            category: ''
            message: Double submit — payload trùng trong dedup window
        '422':
          - code: '4221'
            category: ''
            message: external_account_id là bắt buộc.
          - code: '4222'
            category: ''
            message: external_account_id phải là số nguyên ≥ 1.
          - code: '4223'
            category: ''
            message: customer_id là bắt buộc.
          - code: '4224'
            category: ''
            message: customer_id không được vượt quá 255 ký tự.
          - code: '6010'
            category: ''
            message: core_plan_id là bắt buộc.
          - code: '6011'
            category: ''
            message: core_plan_id không được vượt quá 100 ký tự.
          - code: '6012'
            category: ''
            message: plan_quantity là bắt buộc.
          - code: '6013'
            category: ''
            message: plan_quantity phải là số nguyên ≥ 1.
          - code: '6014'
            category: ''
            message: plan_quantity không được vượt quá 100.
          - code: '6002'
            category: ''
            message: Đơn hàng tìm được không phải loại Multi-Domain/FLEX.
          - code: '6003'
            category: ''
            message: Đơn hàng ở trạng thái không cho phép top-up (EXPIRED, FAILED, CANCELED...).
          - code: '6005'
            category: ''
            message: Tổng SAN sau top-up vượt quá giới hạn tối đa (max_san).
          - code: '6006'
            category: ''
            message: Đơn hàng chưa được gán provider (chưa qua routing).
          - code: '4200'
            category: ''
            message: Dữ liệu request không hợp lệ (validate chung)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StandardSuccess:
      type: object
      required:
        - success
        - error
        - data
      properties:
        success:
          type: boolean
          example: true
          description: Trạng thái xử lý của request — true nếu thành công
        error:
          type:
            - 'null'
          example: null
          description: Thông tin lỗi — null khi request thành công
        data:
          description: Dữ liệu trả về tuỳ vào từng endpoint khác nhau
      x-manual-edit-fields:
        - properties.error.description
        - properties.success.description
    ListInternalProductsData:
      type: object
      properties:
        Thuộc tính:
          type: string
          description: Mô tả
        id:
          type: string
          description: Primary key UUID v4 — auto generate.
          readOnly: true
        code:
          type: string
          description: Mã nội bộ — admin define lúc tạo. UNIQUE, IMMUTABLE. Regex ^[A-Z0-9_-]{2,64}$ (VD "PA-SSL-DV-SINGLE-1Y").
        name:
          type: string
          description: Tên hiển thị tiếng Việt (≤ 200 ký tự).
        name_en:
          type: string
          description: Tên tiếng Anh (optional, ≤ 200 ký tự).
        product_type:
          type: string
          description: 'Mức xác thực: DV | OV | EV. IMMUTABLE sau create (định danh bản chất sản phẩm).'
        cert_type:
          type: string
          description: 'Kiểu cert: SINGLE | WILDCARD | MULTI_DOMAIN | FLEX. IMMUTABLE sau create.'
        description:
          type: string
          description: Mô tả hiển thị UI.
        retail_price_vnd:
          type: number
          description: Giá bán lẻ đề xuất (VND/năm) cho customer UI.
        is_enabled:
          type: boolean
          description: Bật/tắt hiển thị/bán. true = được chọn cho order mới.
        display_order:
          type: integer
          description: Thứ tự hiển thị UI (ascending). Mặc định 0.
        created_at:
          type: string
          description: Thời điểm tạo (UTC).
          readOnly: true
        updated_at:
          type: string
          description: Thời điểm cập nhật gần nhất (UTC).
          readOnly: true
        created_by:
          type: string
          description: Admin ID người tạo.
        updated_by:
          type: string
          description: Admin ID người cập nhật gần nhất.
        deleted_at:
          type: string
          description: Soft delete timestamp. Null = chưa xóa.
    StandardError:
      type: object
      description: Standard error response wrapper.
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
          example: false
          description: Trạng thái xử lý của request — luôn là false khi có lỗi
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              description: Internal application error code.
              example: 4200
            message:
              type: string
              description: Human-readable error message.
              example: Dữ liệu không hợp lệ
            data:
              type:
                - object
                - 'null'
              description: Optional error detail payload.
          description: Thông tin chi tiết về lỗi xảy ra
      x-manual-edit-fields:
        - properties.error.description
        - properties.success.description
    CreateInternalProductRequest:
      type: object
      properties:
