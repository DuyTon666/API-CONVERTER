      description: API cho phép lấy danh sách tất cả ticket thuộc về một khách hàng cụ thể dựa trên user_id. Chỉ khách hàng sở hữu hoặc nhân viên có quyền mới được phép xem danh sách ticket này.
      tags:
        - Ticket
