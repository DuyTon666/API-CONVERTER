                description: Trường `selected`.
          description: Snapshot tất cả candidates + score để audit quyết định routing.
      description: Schema `CreateOrderDataRouting_info`.
    CreateOrderData:
      type: object
      properties:
        id:
          type: integer
          description: ID (BIGINT auto-increment) của order — dùng cho tất cả các API tiếp theo.
          readOnly: true
        order_number:
          type: string
          description: Mã đơn hàng SSL-YYYY-NNNNNN. Hệ thống bán dùng mã này để truy vấn và hiển thị.
        external_account_id:
          type: integer
          description: Echo lại ID account từ hệ thống bán (BIGINT) — để xác nhận đã lưu.
        customer_id:
          type: integer
          description: Trường `customer_id`.
          readOnly: true
        internal_product_code:
          type: string
          description: Trường `internal_product_code`.
        internal_product_id:
          type: integer
          description: Trường `internal_product_id`.
          readOnly: true
        product_type:
          type: string
          description: Trường `product_type`.
        cert_type:
          type: string
          description: Trường `cert_type`.
        years:
          type: integer
          description: Trường `years`.
        subscription_start_date:
          type: string
          description: Trường `subscription_start_date`.
        subscription_end_date:
          type: string
          description: Trường `subscription_end_date`.
        primary_domain:
          type: string
          description: Trường `primary_domain`.
        status:
          type: string
          description: Luôn là INIT ở bước tạo. Chưa có CSR/DCV.
        note:
          type:
            - string
            - 'null'
          description: Trường `note`.
        contact:
          $ref: '#/components/schemas/CreateOrderDataContact'
          description: Echo lại thông tin contact đã lưu (contact_admin, contact_org, contact_tech).
        selected_provider:
          type: object
          properties:
            provider_id:
              type: integer
              description: Trường `provider_id`.
              readOnly: true
            code:
              type: string
              description: Mã số.
            name:
              type: string
              description: Tên.
            provider_product_id:
              type: integer
              description: Trường `provider_product_id`.
              readOnly: true
            provider_product_code:
              type: string
              description: Trường `provider_product_code`.
            mapping_id:
              type: integer
              description: Trường `mapping_id`.
              readOnly: true
            weight:
              type: integer
              description: Trường `weight`.
          description: Provider + provider_product được WRR chọn. Bao gồm mapping_id để trace.
        routing_info:
          $ref: '#/components/schemas/CreateOrderDataRouting_info'
          description: Trường `routing_info`.
        created_at:
          type: string
          description: Ngày tạo.
          readOnly: true
        updated_at:
          type: string
          description: Ngày cập nhật.
          readOnly: true
      description: Schema `CreateOrderData`.
    ChangeOrderDcvMethodRequest:
      type: object
      example:
        domain: example.com
        method: HTTP
        approver_email: admin@example.com
      properties:
        domain:
          type: string
          description: Domain cần đổi DCV. Phải tồn tại trong dcv_records của cert hiện tại. Tối đa 255 ký tự.
          example: example.com
        method:
          type: string
          description: 'Phương thức DCV mới: EMAIL | HTTP | CNAME.'
          example: HTTP
        approver_email:
          type: string
          description: Email approver nhận mã xác thực. Bắt buộc khi method=EMAIL. Bỏ qua khi HTTP/CNAME. RFC 5322. Tối đa 255 ký tự.
          example: admin@example.com
      required:
        - domain
        - method
      description: Schema `ChangeOrderDcvMethodRequest`.
    ChangeOrderDcvMethodData:
      type: object
      properties:
        domain:
          type: string
          description: Domain vừa được đổi phương thức DCV.
        method:
          type: string
          description: 'Phương thức DCV mới: EMAIL | HTTP | CNAME.'
        approver_email:
          type:
            - string
            - 'null'
          description: Email approver nếu method=EMAIL. null nếu HTTP/CNAME.
        status:
          type: string
          description: Luôn là PENDING — domain cần xác minh lại từ đầu.
      description: Schema `ChangeOrderDcvMethodData`.
    ValidateOrderDcvData:
      type: object
      properties:
        order_status:
          type: string
          description: 'Trạng thái mới của order: ACTIVE (tất cả xác thực, cert issued) | PENDING (chưa xong) | DCV_PENDING | FAILED.'
        certificate_status:
          type: string
          description: 'Trạng thái raw từ provider. VD Daousign: "Awaiting Validation (Full)" | "Valid" | "Reject" | "Revoked".'
        all_validated:
          type: boolean
          description: True nếu tất cả dcv_records đều VALIDATED.
        dcv_records:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                description: PENDING | VALIDATED | FAILED — cập nhật sau khi kiểm tra provider.
              validated_at:
                type: string
                description: Thời điểm xác thực thành công. Null nếu chưa validated.
          description: Danh sách kết quả validation từng domain.
      description: Schema `ValidateOrderDcvData`.
    GetOrderDetailData:
      type: object
      properties:
        contact:
          type: object
          description: Thông tin liên hệ đã lưu khi tạo order. Không lộ password hay thông tin nhạy cảm.
        install_target:
          type: object
          description: Thông tin cài đặt hosting. password field bị mask (không trả về qua API này).
        provider:
          type: object
          description: Provider + mapping được chọn lúc tạo order (denormalized từ orders bảng).
        certificates:
          type: array
          items:
            type: object
            properties:
              cert_pem:
                type: string
                description: Certificate PEM. Null nếu chưa cấp.
              chain_pem:
                type: string
                description: Intermediate chain PEM. Null nếu chưa có.
              has_private_key:
                type: boolean
                description: True nếu có private key được lưu (encrypted). Key không trả qua API này.
          description: Danh sách cert đã cấp (thường 1 cert active + các cert cũ đã revoke/expire).
        dcv_records:
          type: array
          items:
            type: object
            properties:
              token:
                type: string
                description: Token xác thực DCV (HTTP/DNS). Null nếu method=EMAIL.
              status:
                type: string
                description: PENDING | VERIFIED | FAILED | EXPIRED.
          description: Các DCV record theo domain. Rỗng nếu chưa có DCV.
      description: Schema `GetOrderDetailData`.
    GenerateCsrForOrderRequest:
      type: object
      example:
        key_type: RSA_2048
        org_name: Công ty Cổ phần Ví dụ
        country: VN
        state: TP. Hồ Chí Minh
        email: admin@example.com
      properties:
        key_type:
          type: string
          description: RSA_2048 | RSA_4096 | ECDSA_P256 | ECDSA_P384. Xác định loại và độ dài khoá.
          enum:
            - RSA_2048
            - RSA_4096
            - ECDSA_P256
            - ECDSA_P384
          default: RSA_2048
          example: RSA_2048
        org_name:
          type: string
          description: Tên tổ chức. Ghi vào trường O= của CSR. Tối đa 64 ký tự.
          default: N/A
          example: Công ty Cổ phần Ví dụ
          maxLength: 64
        country:
          type: string
          description: Mã quốc gia ISO 3166-1 alpha-2 (2 ký tự). Ghi vào trường C= của CSR.
          format: iso3166-alpha2
          default: US
          example: VN
        state:
          type: string
          description: Tỉnh / thành phố. Ghi vào trường ST= của CSR. Tối đa 128 ký tự.
          default: N/A
          example: TP. Hồ Chí Minh
          maxLength: 128
        email:
          type: string
          description: Email liên hệ. Dùng cho form TheSSLStore. Phải đúng format RFC 5322 nếu cung cấp.
          format: email
          example: admin@example.com
      description: Schema `GenerateCsrForOrderRequest`.
    GenerateCsrForOrderData:
      type: object
      properties:
        csr:
          type: string
          description: CSR PEM đầy đủ. Bắt đầu bằng -----BEGIN CERTIFICATE REQUEST-----. Dùng trực tiếp làm input cho API submit-csr.
        private_key:
          type: string
          description: Private Key PEM dạng PKCS#8. Chỉ trả về một lần — hệ thống KHÔNG lưu plaintext. Client phải lưu trữ an toàn ngay lập tức.
        common_name:
          type: string
          description: 'CN được ghi vào CSR. Với Wildcard cert: *.domain.com. Với SINGLE/MULTI_DOMAIN: domain chính của order.'
        key_type:
          type: string
          description: 'Loại khoá đã dùng để sinh CSR: RSA_2048 | RSA_4096 | ECDSA_P256 | ECDSA_P384.'
        source:
          type: string
          description: '"sslstore" — CSR được sinh bởi TheSSLStore API. "internal" — CSR được sinh bởi openssl nội bộ (fallback).'
      description: Schema `GenerateCsrForOrderData`.
    ReissueOrderByIdRequest:
      type: object
      properties:
        reissue_reason:
          type: string
          description: 'Lý do cấp lại (tùy chọn). Xem bảng reissue_reason bên dưới. Có thể bỏ trống khi reissue kỹ thuật (ví dụ: AUTO_RENEWAL do hệ thống tạo).'
        csr:
          type:
            - string
            - 'null'
          description: CSR PEM mới. null/bỏ trống → reuse CSR của cert hiện tại. CSR giống cert hiện tại → cũng tự động reuse.
        private_key:
          type:
            - string
            - 'null'
          description: Private key PEM (browser-generated). Chỉ dùng kèm csr mới. Server mã hoá và lưu. Không cung cấp → server không lưu key.
        contact_admin:
          type:
            - object
            - 'null'
          description: 'Bắt buộc. Thông tin admin contact. Các trường con: email (required, RFC 5322), first_name (required), last_name (required), phone (required, E.164), title (optional). Replace hoàn toàn contact_admin của order.'
          properties: {}
        contact_org:
          type: object
          description: 'Bắt buộc. Thông tin tổ chức: name, address, province, country (ISO 3166-1 alpha-2), postal_code, phone (tất cả required). business_number, representative_name, duns (optional). Replace hoàn toàn contact_org của order.'
          properties: {}
        contact_tech:
          type:
            - object
            - 'null'
          description: 'Bắt buộc. Thông tin tech contact. Các trường con: email (required, RFC 5322), first_name (required), last_name (required), phone (required, E.164), title (optional). Replace hoàn toàn contact_tech của order.'
          properties: {}
        san_list:
          type: array
          description: Bắt buộc truyền. Danh sách SAN mới — replace hoàn toàn san_list của order. Truyền [] để xóa hết SAN. Mỗi item là string tối đa 255 ký tự.
          items:
            type: string
        dcv_config:
          type:
            - object
            - 'null'
          description: 'Bắt buộc. Key = domain, value = {method: EMAIL|HTTP|HTTPS|CNAME, approver_email}. Phải cover đầy đủ primary_domain + tất cả domain trong san_list. Thiếu domain → lỗi 4622 với data.missing_domains.'
          properties: {}
      required:
        - contact_admin
        - contact_org
        - contact_tech
        - san_list
        - dcv_config
      description: Schema `ReissueOrderByIdRequest`.
    ReissueOrderByIdData:
      type: object
      properties:
        order_id:
          type: integer
          description: orders.id — BIGINT auto-increment.
          readOnly: true
        order_number:
          type: string
          description: Mã đơn hàng hiển thị (ví dụ SSL-2026-000042).
        new_cert_id:
          type: integer
          description: certificates.id của cert REISSUE_QUEUED vừa tạo. Worker sẽ gọi provider với cert này.
        replaces_cert_id:
          type:
            - integer
            - 'null'
          description: certificates.id của cert hiện tại sẽ bị thay thế (replaces_cert_id FK). null nếu không có cert trước đó.
        cert_seq:
          type: integer
          description: 'Số thứ tự reissue: cert gốc = 1, reissue lần 1 = 2, v.v. Dùng để track chuỗi reissue.'
        status:
          type: string
          description: REISSUE_QUEUED — cert đã được tạo trong DB, chờ worker gửi lên provider.
        message:
          type: string
          description: Thông báo xác nhận yêu cầu đã xếp hàng.
      description: Schema `ReissueOrderByIdData`.
    RenewOrderRequest:
      type: object
      example:
        years: 1
        dcv_method: HTTP
        contact_admin:
          email: admin@example.com
          first_name: Nguyen
          last_name: Van A
          phone: '+84901234567'
          title: Manager
        contact_org:
