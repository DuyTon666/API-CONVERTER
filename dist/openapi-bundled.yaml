          address: 123 Le Loi, Ha Noi
          province: Ha Noi
          country: VN
          postal_code: '100000'
          phone: '+84243456789'
          business_number: '0123456789'
          representative_name: Nguyen Van A
          duns: '123456789'
        contact_tech:
          email: tech@example.com
          first_name: Tran
          last_name: Thi B
          phone: '+84901234568'
          title: Developer
        note: Gia hạn theo yêu cầu khách hàng
