        contact_admin:
          type: object
          description: Ghi đè contact_admin. Null = kế thừa từ order gốc. Mọi sub-field tùy chọn.
          example:
            email: admin@example.com
            first_name: Nguyen
            last_name: Van A
            phone: '+84901234567'
            title: Manager
          properties:
            email:
              type: string
              description: Email admin (RFC 5322).
              example: admin@example.com
            first_name:
              type: string
              description: Tên (≤ 100 ký tự).
              example: Nguyen
            last_name:
              type: string
              description: Họ (≤ 100 ký tự).
              example: Van A
            phone:
              type: string
              description: 'Điện thoại E.164 (VD: +84901234567).'
              example: '+84901234567'
            title:
              type: string
              description: Chức danh (≤ 50 ký tự).
              example: Manager
        contact_org:
          type: object
          description: 'Ghi đè contact_org. Null = kế thừa từ order gốc. Nếu cung cấp: name, address, country bắt buộc.'
          example:
            name: Example Co. Ltd
            address: 123 Le Loi, Ha Noi
            province: Ha Noi
            country: VN
            postal_code: '100000'
            phone: '+84243456789'
            business_number: '0123456789'
            representative_name: Nguyen Van A
            duns: '123456789'
          properties:
            name:
              type: string
              description: Tên tổ chức (≤ 200 ký tự). *Bắt buộc khi cung cấp contact_org.
              example: Example Co. Ltd
            address:
              type: string
              description: Địa chỉ (≤ 500 ký tự). *Bắt buộc khi cung cấp contact_org.
              example: 123 Le Loi, Ha Noi
            province:
              type: string
              description: Tỉnh/thành phố (≤ 100 ký tự).
              example: Ha Noi
            country:
              type: string
              description: 'Mã quốc gia ISO 3166-1 alpha-2 (VD: VN). *Bắt buộc khi cung cấp contact_org.'
              example: VN
            postal_code:
              type: string
              description: Mã bưu chính (≤ 20 ký tự).
              example: '100000'
            phone:
              type: string
              description: Điện thoại E.164.
              example: '+84243456789'
            business_number:
              type: string
              description: Mã số thuế / số đăng ký kinh doanh (≤ 50 ký tự).
              example: '0123456789'
            representative_name:
              type: string
              description: Tên người đại diện (≤ 150 ký tự).
              example: Nguyen Van A
            duns:
              type: string
              description: Mã DUNS (≤ 50 ký tự).
              example: '123456789'
          required:
            - name
            - address
            - country
        contact_tech:
          type: object
          description: Ghi đè contact_tech. Null = kế thừa từ order gốc. Mọi sub-field tùy chọn.
          example:
            email: tech@example.com
            first_name: Tran
            last_name: Thi B
            phone: '+84901234568'
            title: Developer
          properties:
            email:
              type: string
              description: Email kỹ thuật (RFC 5322).
              example: tech@example.com
            first_name:
              type: string
              description: Tên (≤ 100 ký tự).
              example: Tran
            last_name:
              type: string
              description: Họ (≤ 100 ký tự).
              example: Thi B
            phone:
              type: string
              description: Điện thoại E.164.
              example: '+84901234568'
            title:
              type: string
              description: Chức danh (≤ 50 ký tự).
              example: Developer
        note:
          type: string
          description: Ghi chú nội bộ (≤ 1000 ký tự).
          example: Gia hạn theo yêu cầu khách hàng
      description: Schema `RenewOrderRequest`.
