openapi: 3.1.0
info:
  title: PA Vietnam Support API
  version: 1.0.0
  license:
    name: API
  description: API cho hệ thống ticket hỗ trợ khách hàng
  contact:
    name: PA Vietnam
    email: dev@pavietnam.vn
servers:
  - url: https://apigateway.pavietnam.vn
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Ticket
    description: Các API liên quan đến ticket hỗ trợ khách hàng
  - name: Account
    description: Các API liên quan đến tài khoản
paths:
  /v1/users/{user_id}/tickets:
    get:
      summary: API Ticket - Hiển thị danh sách ticket cho khách hàng
      operationId: getTickets
      description: ''
      tags:
        - Ticket
      security:
        - bearerAuth: []
      x-permission: CHECK_UPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Số thứ tự trang muốn hiển thị
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Tổng số ticket muốn hiển thị trên một trang
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - CREATED
              - IN_PROGRESS
              - PENDING
              - CLOSED
          description: 'Tìm kiếm theo trạng thái:CREATED: Mới tạoIN_PROGRESS: Đang xử lýPENDING: Chờ phản hồiCLOSED: Đóng'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 'Nội dung cần tìm kiếm- Tìm kiếm theo: Mã ticket, tiêu đề.- Tối thiểu 4 ký tự'
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Tìm kiếm từ ngày (Y-m-d H:i:s)- date_to>=data_from
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Tìm kiếm đến ngày (Y-m-d H:i:s)- date_to>=data_from
        - name: sort_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - LAST_UPDATED_DESC
              - CREATED_DATE_DESC
          description: 'Kiểu sắp xếp:LAST_UPDATED_DESC:Ngày cập nhật giảm dầnCREATED_DATE_DESC: Ngày tạo giảm dần'
        - name: post_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - USER
              - SYSTEM
          description: 'Người tạo ticketUSER: user hiện tại (khách hàng)SYSTEM: hệ thống'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GetTicketsData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 4200 — Dữ liệu request không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: API Ticket - Tạo ticket cho khách hàng
      operationId: createTickets
      description: ''
      tags:
        - Ticket
      security:
        - bearerAuth: []
      x-permission: CHECK_NEWUPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccess'
              example:
                success: true
                data: null
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |-
            4200 — Dữ liệu request không hợp lệ
            4462 — Tạo yêu cầu thất bại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTicketsRequest'
