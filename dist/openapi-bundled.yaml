                - address
                - country
            contact_tech:
              type: object
              properties:
                email:
                  type: string
                  description: Email kỹ thuật viên. Bắt buộc nếu contact_tech != null.
                first_name:
                  type: string
                  description: Tên.
                last_name:
                  type: string
                  description: Họ.
                phone:
                  type: string
                  description: Số điện thoại. E.164.
                title:
                  type: string
                  description: 'Chức danh: Mr | Mrs | Ms | Dr | ...'
