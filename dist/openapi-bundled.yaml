openapi: 3.1.0
info:
  title: PA Vietnam Support API
  version: 1.0.0
  license:
    name: API
  description: API cho hệ thống ticket hỗ trợ khách hàng
  contact:
    name: PA Vietnam
    email: dev@pavietnam.vn
servers:
  - url: https://apigateway.pavietnam.vn
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Ticket
    description: Các API liên quan đến ticket hỗ trợ khách hàng
  - name: Account
    description: Các API liên quan đến tài khoản
paths:
  /v1/admin/internal-products:
    post:
      summary: Tạo sản phẩm nội bộ mới trong hệ thống
      operationId: createInternalProduct
      description: Tạo mới một sản phẩm nội bộ dành cho quản trị viên, cho phép định nghĩa thông tin sản phẩm chỉ sử dụng trong phạm vi nội bộ của hệ thống. Chỉ các tài khoản có quyền admin mới được phép thực hiện thao tác này.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters: []
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateInternalProductData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalProductRequest'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '409':
          - code: '4090'
            category: Idempotency
            message: Idempotency-Key đang xử lý (concurrent)
          - code: '4091'
            category: Idempotency
            message: Double submit — payload trùng trong dedup window
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
          - code: '6401'
            category: Unique
            message: code đã tồn tại trong hệ thống
          - code: '6409'
            category: Format
            message: code không hợp lệ — chỉ cho [A-Z0-9_-], 2-64 chars
          - code: '6410'
            category: Business
            message: 'Kết hợp product_type + cert_type không hợp lệ (VD: EV + WILDCARD)'
    get:
      summary: Lấy danh sách sản phẩm nội bộ
      operationId: listInternalProducts
      description: Truy xuất danh sách tất cả sản phẩm nội bộ dành cho quản trị viên hệ thống. Chỉ người dùng có quyền admin mới được phép truy cập endpoint này.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Số trang (≥1)
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Record/trang (max 100)
        - name: is_enabled
          in: query
          required: false
          schema:
            type: integer
          description: 1=enabled, 0=disabled
        - name: product_type
          in: query
          required: false
          schema:
            type: string
          description: DV | OV | EV
        - name: cert_type
          in: query
          required: false
          schema:
            type: string
          description: SINGLE | WILDCARD | MULTI_DOMAIN | FLEX
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: LIKE code hoặc name (min 2 chars)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: display_order:asc
          description: Format field:asc|desc
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ListInternalProductsData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
  /v1/admin/internal-products/{id}:
    delete:
      summary: Xóa sản phẩm nội bộ theo ID
      operationId: deleteInternalProduct
      description: Xóa vĩnh viễn một sản phẩm nội bộ khỏi hệ thống dựa trên ID được cung cấp. Chỉ quản trị viên có quyền thực hiện thao tác này và sản phẩm không thể khôi phục sau khi xóa.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeleteInternalProductData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteInternalProductRequest'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '404':
          - code: '6004'
            category: Not Found
            message: Internal product không tồn tại (hoặc đã soft-deleted)
        '409':
          - code: '4090'
            category: Idempotency
            message: Idempotency-Key đang xử lý (concurrent)
          - code: '4091'
            category: Idempotency
            message: Double submit — payload trùng trong dedup window
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
          - code: '6403'
            category: Business
            message: Không thể xóa — còn provider_product_mappings active liên kết
          - code: '6404'
            category: Business
            message: Không thể xóa — còn order active sử dụng internal product này
    get:
      summary: Lấy chi tiết sản phẩm nội bộ theo ID
      operationId: getInternalProductDetail
      description: Truy xuất thông tin chi tiết của một sản phẩm nội bộ dựa trên ID được cung cấp. Chỉ quản trị viên có quyền truy cập mới có thể xem thông tin sản phẩm nội bộ này.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GetInternalProductDetailData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '404':
          - code: '6004'
            category: Not Found
            message: Internal product không tồn tại (hoặc đã soft-deleted)
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
    patch:
      summary: Cập nhật thông tin sản phẩm nội bộ
      operationId: updateInternalProduct
      description: Cập nhật thông tin của sản phẩm nội bộ theo ID được chỉ định. Chỉ admin mới có quyền thực hiện thao tác này và sản phẩm phải tồn tại trong hệ thống.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccess'
              example:
                success: true
                data: null
                error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInternalProductRequest'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '404':
          - code: '6004'
            category: ''
            message: id không tồn tại trong DB
        '409':
          - code: '4090'
            category: Idempotency
            message: Idempotency-Key đang xử lý (concurrent)
          - code: '4091'
            category: Idempotency
            message: Double submit — payload trùng trong dedup window
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
          - code: '6402'
            category: ''
            message: Body chứa field immutable (product_type, cert_type, code)
          - code: '6405'
            category: ''
            message: Record tồn tại nhưng đã bị soft-delete
          - code: '6406'
            category: ''
            message: Body không chứa field mutable nào
          - code: '6407'
            category: ''
            message: default_san không phải integer hoặc < 0
          - code: '6408'
            category: ''
            message: max_san không phải integer hoặc < 1
  /v1/admin/internal-products/{id}/mappings:
    post:
      summary: Tạo mapping cho sản phẩm nội bộ
      operationId: createInternalProductMapping
      description: Tạo liên kết mapping mới cho sản phẩm nội bộ theo ID được chỉ định. Chỉ quản trị viên có quyền thực hiện thao tác này và mỗi sản phẩm phải đảm bảo tính duy nhất trong cấu hình mapping.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateInternalProductMappingData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalProductMappingRequest'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '404':
          - code: '6004'
            category: Not Found
            message: Internal product không tồn tại (hoặc đã soft-deleted)
        '409':
          - code: '4090'
            category: Idempotency
            message: Idempotency-Key đang xử lý (concurrent)
          - code: '4091'
            category: Idempotency
            message: Double submit — payload trùng trong dedup window
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
          - code: '6502'
            category: Compat
            message: Compatibility mismatch — product_type hoặc cert_type không khớp giữa internal product và provider product
          - code: '6503'
            category: Unique
            message: Internal product này đã có mapping với provider này — không thể map 2 sản phẩm của cùng 1 provider cho 1 internal
          - code: '6504'
            category: Business
            message: Provider product không tồn tại / đã xóa / provider đã bị disable hoặc soft-deleted
          - code: '6505'
            category: Unique
            message: Cặp (internal, provider_product) đã được mapping trước đó
          - code: '6506'
            category: Format
            message: routing_weight không hợp lệ — phải là integer trong range [1, 100]
    get:
      summary: Lấy danh sách mapping của sản phẩm nội bộ
      operationId: listInternalProductMappings
      description: Lấy danh sách các mapping liên kết của một sản phẩm nội bộ theo ID. Chỉ dành cho quản trị viên, yêu cầu ID sản phẩm hợp lệ và tồn tại trong hệ thống.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: is_active
          in: query
          required: false
          schema:
            type: integer
          description: 1=active, 0=inactive
        - name: provider_code
          in: query
          required: false
          schema:
            type: string
          description: Filter theo provider code
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ListInternalProductMappingsData'
                      internal_product_id:
                        type: string
                        readOnly: true
                      provider_product_id:
                        type: string
                        readOnly: true
                      provider_id:
                        type: string
                        readOnly: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '404':
          - code: '6004'
            category: Not Found
            message: Internal product không tồn tại (hoặc đã soft-deleted)
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
  /v1/admin/internal-products/{id}/mappings/{mapping_id}:
    delete:
      summary: Xóa mapping của sản phẩm nội bộ
      operationId: deleteInternalProductMapping
      description: Xóa liên kết mapping của một sản phẩm nội bộ theo ID mapping cụ thể. Chỉ quản trị viên có quyền thực hiện thao tác này và mapping phải thuộc sản phẩm nội bộ tương ứng.
      tags:
        - Admin
      security:
        - bearerAuth: []
      x-permission: ''
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: mapping_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeleteInternalProductMappingData'
                      internal_product_id:
                        type: string
                        readOnly: true
                      provider_product_id:
                        type: string
                        readOnly: true
                      provider_id:
                        type: string
                        readOnly: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/StandardError422'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteInternalProductMappingRequest'
      x-error-responses:
        '401':
          - code: '4101'
            category: Auth
            message: Thiếu Authorization header
          - code: '4102'
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        '403':
          - code: '4103'
            category: Auth
            message: Client không có scope=admin
          - code: '4108'
            category: Auth
            message: IP không được phép
        '404':
          - code: '6004'
            category: Not Found
            message: Internal product không tồn tại (hoặc đã soft-deleted)
          - code: '6501'
            category: Not Found
            message: Mapping không tồn tại (hoặc đã soft-deleted)
        '409':
          - code: '4090'
            category: Idempotency
            message: Idempotency-Key đang xử lý (concurrent)
          - code: '4091'
            category: Idempotency
            message: Double submit — payload trùng trong dedup window
        '422':
          - code: '4200'
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
          - code: '6404'
            category: Business
            message: Không thể xóa — còn order active sử dụng internal product này
    patch:
