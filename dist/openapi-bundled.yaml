            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderPlanTopupData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
