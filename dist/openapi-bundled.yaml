          properties:
            contact_admin:
              type: object
              properties:
                email:
                  type: string
                  description: Email người quản lý. RFC 5322.
                first_name:
                  type: string
                  description: Tên.
                last_name:
                  type: string
                  description: Họ.
                phone:
                  type: string
                  description: Số điện thoại. E.164.
                title:
                  type: string
                  description: 'Chức danh: Mr | Mrs | Ms | Dr | ...'
            contact_org:
              type: object
              properties:
                name:
                  type: string
