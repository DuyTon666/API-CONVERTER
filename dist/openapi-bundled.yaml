    SubmitCsrForOrderRequest:
      type: object
      properties:
        csr:
          type: string
          description: 'CSR PEM. Bắt buộc. Format: "-----BEGIN CERTIFICATE REQUEST-----...". CN hoặc SAN phải chứa primary_domain.'
          example: |-
            -----BEGIN CERTIFICATE REQUEST-----
            MIIC...
            -----END CERTIFICATE REQUEST-----
        web_server_type:
          type: string
          description: 'apache | nginx | iis | tomcat | cpanel | plesk | other. Mặc định: other.'
          enum:
            - apache
            - nginx
            - iis
            - tomcat
            - cpanel
            - plesk
            - other
          example: nginx
        signature_hash_algorithm:
          type: string
          description: SHA2-256 | SHA2-384 | SHA2-512. Mặc định SHA2-256.
          enum:
            - SHA2-256
            - SHA2-384
            - SHA2-512
          example: SHA2-256
        auto_www:
          type: boolean
          description: Tự động thêm www.{primary_domain} vào SAN. Mặc định true.
          example: true
        cert_transparency:
          type: boolean
          description: Ghi vào Certificate Transparency log. Mặc định true.
          example: true
        approver_email:
          type: string
          description: Email phê duyệt DCV. Bắt buộc khi dcv_method = EMAIL.
          format: email
          example: admin@example.com
        san_list:
          type: array
          description: Danh sách SAN. Chỉ áp dụng với MULTI_DOMAIN/FLEX — bị bỏ qua với cert_type khác. Không truyền hoặc [] → xóa san_list cũ.
          example:
            - www.example.com
            - mail.example.com
          items:
            type: string
            example: www.example.com
        contact_admin:
          type: object
          description: Admin Contact. Bắt buộc mỗi lần gọi.
          example:
            email: admin@example.com
            first_name: Nguyen
            last_name: Van A
            phone: '+84901234567'
            title: Mr
          properties:
            email:
              type: string
              description: RFC 5322.
              example: admin@example.com
            first_name:
              type: string
              description: Tên.
              example: Nguyen
            last_name:
              type: string
              description: Họ.
              example: Van A
            phone:
              type: string
              description: E.164.
              example: '+84901234567'
            title:
              type: string
              description: Mr | Mrs | Ms | Dr | ...
              example: Mr
          required:
            - email
            - first_name
            - last_name
            - phone
        contact_org:
          type: object
          description: Organization Contact. Bắt buộc mỗi lần gọi với mọi cert type.
          example:
            name: Example Co., Ltd.
