  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          example:
            success: false
            data: null
            error:
              code: 400
              message: Bad Request
    Unauthorized:
      description: Token không hợp lệ hoặc đã hết hạn - Mã lỗi 4102
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          example:
            success: false
            error:
              code: 4102
              message: Token không hợp lệ hoặc đã hết hạn
              data: null
    Forbidden:
      description: IP không hợp lệ - Mã lỗi 4108
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          example:
            success: false
            error:
              code: 4108
              message: IP không được phép truy cập
              data: null
    NotFound:
      description: Không tim thấy dữ liệu - Mã lỗi 4004
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          example:
            success: false
            error:
              code: 4004
              message: Không tìm thấy dữ liệu
              data: null
    InternalError:
      description: Lỗi server không mong muốn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
          example:
            success: false
            error:
              code: 500
              message: Lỗi hệ thống, vui lòng thử lại sau
              data:
                type:
                  - null
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
    StandardError422:
      description: Lỗi nghiệp vụ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chống double submit. Strongly recommended cho POST/PATCH/DELETE.
      schema:
        type: string
        format: uuid
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Trace ID để debug request — optional, xuất hiện ở toàn bộ APIs trong hệ thống.
      schema:
        type: string
      example: req-abc123
    XClientId:
      name: X-Client-Id
      in: header
      required: false
      description: Client identifier dùng cho audit/logging.
      schema:
        type: string
  headers:
    CacheControl:
      description: Cache policy của response.
      schema:
        type: string
      example: no-store, no-cache, must-revalidate
    ContentDisposition:
      description: Tên file trả về khi response là attachment/download.
      schema:
        type: string
      example: attachment; filename="example.zip"
    XContentTypeOptions:
      description: Security header chống MIME sniffing.
      schema:
        type: string
        enum:
          - nosniff
        example: nosniff
