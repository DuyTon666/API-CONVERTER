openapi: 3.1.0
info:
  title: PA Vietnam Support API
  version: 1.0.0
  license:
    name: API
  description: API cho hệ thống ticket hỗ trợ khách hàng
  contact:
    name: PA Vietnam
    email: dev@pavietnam.vn
servers:
  - url: https://apigateway.pavietnam.vn
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Ticket
    description: Các API liên quan đến ticket hỗ trợ khách hàng
  - name: Account
    description: Các API liên quan đến tài khoản
paths:
  /v1/departments:
    get:
      summary: Lấy danh sách phòng ban gửi ticket
      operationId: getDepartmentList
      description: API trả về danh sách các phòng ban có quyền gửi ticket trong hệ thống. Dữ liệu được sử dụng để hiển thị lựa chọn phòng ban khi người dùng tạo hoặc lọc ticket.
      tags:
        - Department
      security:
        - bearerAuth: []
      x-permission: ""
      parameters:
        - name: support_company
          in: query
          required: false
          schema:
            type: string
          description: "Các giá trị hợp lệ:"
        - name: id
          in: query
          required: false
          schema:
            type: integer
            default: Id phòng ban
        - name: title
          in: query
          required: false
          schema:
            type: string
            default: Tiêu đề
        - name: name
          in: query
          required: false
          schema:
            type: string
            default: Tên phòng ban
        - name: comment
          in: query
          required: false
          schema:
            type: string
            default: Mô tả/ ghi chú của phòng ban
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GetDepartmentListData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/orders/{id}/certificates/{certId}/download:
    get:
      summary: Tải xuống chứng chỉ của đơn hàng
      operationId: downloadOrderCertificate
      description: Tải xuống tệp chứng chỉ theo ID đơn hàng và ID chứng chỉ tương ứng. Yêu cầu đơn hàng phải tồn tại và chứng chỉ phải được cấp phát hợp lệ trước khi thực hiện tải xuống.
      tags:
        - Order
      security:
        - bearerAuth: []
      x-permission: ""
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: certId
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: zip
            enum:
              - zip
              - json
          description: zip (default) — trả file ZIP. json — trả JSON với PEM strings.
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XClientId"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DownloadOrderCertificateData"
            application/zip:
              schema:
                $ref: "#/components/schemas/BinaryFile"
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
            X-Content-Type-Options:
              $ref: "#/components/headers/XContentTypeOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/StandardError422"
        "500":
          $ref: "#/components/responses/InternalError"
      x-error-responses:
        "401":
          - code: 4101
            category: Auth
            message: Thiếu Authorization header
          - code: 4102
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        "403":
          - code: 4103
            category: Auth
            message: Client không có scope=admin
          - code: 4108
            category: Auth
            message: IP không được phép
        "404":
          - code: 4001
            category: Not Found
            message: Order không tồn tại, hoặc certificate không thuộc order này
        "409":
          - code: 4090
            category: Idempotency
            message: Idempotency-Key đang xử lý (concurrent)
          - code: 4091
            category: Idempotency
            message: Double submit — payload trùng trong dedup window
        "422":
          - code: 4200
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
          - code: 4301
            category: State
            message: Certificate không ở trạng thái ISSUED — không thể download (SUPERSEDED, REVOKED, EXPIRED, REISSUE_QUEUED...)
          - code: 4302
            category: State
            message: certificate_pem rỗng — cert chưa được cấp hoàn chỉnh (provider chưa trả về PEM)
  /v1/services/types:
    get:
      summary: Lấy danh sách các loại dịch vụ hỗ trợ
      operationId: getServiceTypes
      description: API trả về danh sách tất cả các loại dịch vụ hiện có trong hệ thống support, phục vụ cho việc phân loại và định tuyến yêu cầu hỗ trợ của khách hàng. Chỉ các loại dịch vụ đang hoạt động và được kích hoạt mới được trả về trong kết quả.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: ""
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            default: "null"
          description: Không truyền sẽ trả về tất cả loại dịch vụ
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"
              example:
                success: true
                data: null
                error: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/users/{user_id}/services:
    get:
      summary: Lấy danh sách dịch vụ của khách hàng
      operationId: getUserServices
      description: API trả về danh sách tất cả các dịch vụ đang được đăng ký bởi một khách hàng cụ thể dựa trên user_id. Chỉ các dịch vụ thuộc về khách hàng hợp lệ và đang hoạt động trong hệ thống mới được trả về.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: "null"
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Số thứ tự trang muốn hiển thị
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Tổng số dịch vụ muốn hiển thị trên một trang
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Nội dung cần tìm kiếm
        - name: type_id
          in: query
          required: false
          schema:
            type: integer
          description: Id loại dịch vụ
        - name: expired_before
          in: query
          required: false
          schema:
            type: integer
          description: Số ngày sắp hết hạn
        - name: auto_renew
          in: query
          required: false
          schema:
            type: integer
          description: "Trạng thái tự động gia hạn (0: không, 1: có)"
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Trạng thái của dịch vụ
        - name: domain_protected
          in: query
          required: false
          schema:
            type: integer
          description: "Trạng thái bảo vệ tên miền (0: không, 1: có)"
        - name: owner_name
          in: query
          required: false
          schema:
            type: string
          description: Tìm kiếm theo tên chủ thể (tìm kiếm chính xác)
        - name: owner_email
          in: query
          required: false
          schema:
            type: string
          description: Tìm kiếm theo email chủ thể (tìm kiếm chính xác)
        - name: owner_phone
          in: query
          required: false
          schema:
            type: string
          description: Tìm kiếm theo số điện thoại chủ thể (tìm kiếm chính
        - name: service_name
          in: query
          required: false
          schema:
            type: string
          description: Tìm kiếm theo tên dịch gói vụ (tìm kiếm chính xác)
        - name: expired_date_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Tìm kiếm theo bắt đầu ngày hết hạn (Y-m-d)
        - name: expired_date_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Tìm kiếm theo kết thúc ngày hết hạn (Y-m-d)
        - name: register_date_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Tìm kiếm theo bắt đầu ngày đăng ký (Y-m-d)
        - name: register_date_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Tìm kiếm theo kết thúc ngày đăng ký (Y-m-d)
        - name: extended_fields
          in: query
          required: false
          schema:
            type: string
          description: Các field mở rộng để trả data các cột tương ứng,
        - name: temporary_service
          in: query
          required: false
          schema:
            type: integer
          description: "1: Lấy danh sách mở tạm dịch vụ"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GetUserServicesData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/StandardError422"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/services/{service_id}/temporary-open:
    post:
      summary: Mở tạm thời dịch vụ theo ID
      operationId: temporaryOpenService
      description: API cho phép mở tạm thời một dịch vụ đang bị tạm ngừng hoặc đóng, dựa trên service_id được cung cấp. Chỉ áp dụng cho các dịch vụ hợp lệ và đang ở trạng thái cho phép mở tạm thời theo quy định nghiệp vụ.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: "null"
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TemporaryOpenServiceData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/StandardError422"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemporaryOpenServiceRequest"
  /v1/users/{user_id}/services/{id}/upgrade-plans:
    get:
      summary: Lấy danh sách gói nâng cấp của dịch vụ
      operationId: getServiceUpgradePlans
      description: API trả về danh sách các gói nâng cấp khả dụng cho một dịch vụ cụ thể của người dùng. Chỉ các dịch vụ đang hoạt động và thuộc sở hữu của user_id hợp lệ mới được phép truy vấn danh sách gói nâng cấp.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: CHECK_UPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/StandardError422"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/users/{user_id}/services/{id}/request-upgrade-plans:
    get:
      summary: Tạo yêu cầu nâng cấp dịch vụ người dùng
      operationId: requestUpgradeServicePlan
      description: API cho phép người dùng tạo yêu cầu nâng cấp gói dịch vụ hiện tại lên gói cao hơn. Yêu cầu nâng cấp chỉ được thực hiện khi dịch vụ đang hoạt động và người dùng có quyền truy cập hợp lệ.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: CHECK_UPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RequestUpgradeServicePlanData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/StandardError422"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/users/{user_id}/services/{id}/change-password:
    post:
      summary: Đổi mật khẩu dịch vụ của người dùng
      operationId: changeServicePassword
      description: API cho phép thay đổi mật khẩu của một dịch vụ cụ thể thuộc về người dùng. Người dùng cần cung cấp đúng thông tin xác thực và mật khẩu mới phải tuân theo các quy tắc bảo mật được quy định.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: CHECK_UPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"
              example:
                success: true
                data: null
                error: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/StandardError422"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeServicePasswordRequest"
  /v1/users/{user_id}/statistics:
    get:
      summary: Lấy thống kê tổng quan cho khách hàng
      operationId: getUserStatistics
      description: API trả về dữ liệu thống kê tổng quan dành cho trang dashboard của khách hàng, bao gồm các chỉ số kinh doanh quan trọng. Chỉ người dùng có quyền hợp lệ mới được phép truy cập thông tin thống kê theo từng user_id cụ thể.
      tags:
        - Statistic
      security:
        - bearerAuth: []
      x-permission: CHECK_UPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GetUserStatisticsData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: 4200 — Dữ liệu request không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/users/{user_id}/tickets/{id}/change-assignee:
    post:
      summary: Yêu cầu đổi nhân viên hỗ trợ ticket
      operationId: changeTicketAssignee
      description: API cho phép người dùng gửi yêu cầu thay đổi nhân viên hỗ trợ (assignee) cho một ticket cụ thể. Yêu cầu chỉ được thực hiện khi ticket đang ở trạng thái mở và người dùng có quyền thực hiện thay đổi trên ticket đó.
      tags:
        - Ticket
      security:
        - bearerAuth: []
      x-permission: CHECK_NEWUPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"
              example:
                success: true
                data: null
                error: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |-
            4200 — Dữ liệu request không hợp lệ
            4468 — Đang chờ nhân viên tiếp nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeTicketAssigneeRequest"
  /v1/users/{user_id}/tickets/{id}:
    get:
      summary: Hiển thị chi tiết ticket của khách hàng
      operationId: getUserTicketDetail
      description: API cho phép khách hàng xem thông tin chi tiết của một ticket cụ thể dựa trên ID người dùng và ID ticket. Khách hàng chỉ có thể truy cập ticket thuộc về tài khoản của mình, không thể xem ticket của người dùng khác.
      tags:
        - Ticket
      security:
        - bearerAuth: []
      x-permission: CHECK_NEWUPDATE
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GetUserTicketDetailData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: 4200 — Dữ liệu request không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/users/{user_id}/tickets/{id}/reopen:
    post:
      summary: Mở lại ticket đã đóng của khách hàng
      operationId: reopenUserTicket
      description: API cho phép mở lại ticket đã đóng hoặc đã giải quyết của khách hàng. Ticket phải ở trạng thái đóng trước khi thực hiện thao tác mở lại, và người dùng phải có quyền truy cập vào ticket tương ứng.
