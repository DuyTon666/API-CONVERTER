components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StandardSuccess:
      type: object
      required:
        - success
        - error
        - data
      properties:
        success:
          type: boolean
          example: true
        error:
          type:
            - "null"
          example: null
        data:
          description: Dữ liệu trả về tuỳ vào từng endpoint khác nhau
    GetDepartmentListData:
      type: object
      properties:
        id:
          type: integer
          description: Id phòng ban
          readOnly: true
        title:
          type: string
          description: Tiêu đề
        name:
          type: string
          description: Tên phòng ban
        comment:
          type: string
          description: Mô tả/ ghi chú của phòng ban
    StandardError:
      type: object
      description: Standard error response wrapper.
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              description: Internal application error code.
              example: 4200
            message:
              type: string
              description: Human-readable error message.
              example: Dữ liệu không hợp lệ
            data:
              type:
                - object
                - "null"
              description: Optional error detail payload.
    DownloadOrderCertificateData:
      type: object
      description: Dữ liệu chứng chỉ SSL dưới dạng chuỗi PEM (chỉ trả về khi format=json)
      properties:
        certificate_pem:
          type: string
          description: Chứng chỉ SSL cuối (end-entity certificate) dưới dạng PEM (nội dung của certificates.certificate_pem)
        intermediate_pem:
          type: string
          description: Chứng chỉ Intermediate CA dưới dạng PEM (có thể rỗng nếu không có)
        root_pem:
          type: string
          description: Chứng chỉ Root CA dưới dạng PEM (có thể rỗng nếu không có)
        has_private_key:
          type: boolean
          description: Cho biết hệ thống có lưu private key (private_key_enc) của chứng chỉ này hay không. Private key không được trả về trực tiếp trong JSON — dùng format=zip để tải về file private.key đã giải mã
      required:
        - certificate_pem
        - intermediate_pem
        - root_pem
        - has_private_key
    BinaryFile:
      type: string
      format: binary
      description: Binary file response.
    GetUserServicesData:
      type: object
      properties:
        current_page:
          type: integer
          description: Số thứ tự trang hiện tại
        next_page_url:
          type: string
          description: Link đến trang tiếp theo
        prev_page_url:
          type: string
          description: Link đến trang trước
        first_page_url:
          type: string
          description: Link đến trang đầu tiên
        per_page:
          type: integer
          description: Số record mỗi trang
        from:
          type: integer
          description: Số thứ tự bắt đầu
        to:
          type: integer
          description: Số thứ tự kết thúc
        data:
          type: array
          items:
            type: object
          description: Danh sách các dịch vụ
    TemporaryOpenServiceRequest:
      type: object
      properties:
        reason:
          type: string
          description: Lý do cần mở tạm
    TemporaryOpenServiceData:
      type: object
      properties:
        temp_open_day:
          type: integer
          description: Số ngày được mở tạm
        temp_expired_date:
          type: string
          description: Ngày hết hạn tạm
    RequestUpgradeServicePlanData:
      type: object
      properties:
        pin:
          type: string
          description: Mã đơn hàng.
        send_email_list:
          type: string
          description: Danh sách email đã gửi thông tin đơn hàng (mỗi email
        upgrade_link:
          type: string
          description: Đường dẫn đến trang nâng cấp.
    ChangeServicePasswordRequest:
      type: object
      properties:
        new_password:
          type: string
          description: Mật khẩu mới
        new_password_confirmation:
          type: string
          description: Nhập lại mật khẩu mới
      required:
        - new_password
        - new_password_confirmation
    GetUserStatisticsData:
      type: object
      properties:
        incomplete_profiles:
          type: integer
          description: Số hồ sơ chưa hoàn thành.
        unpaid_orders:
          type: integer
          description: Số đơn hàng chờ thanh toán
        expiring_soon_services:
          type: integer
          description: Số dịch vụ sắp hết hạn (30 ngày trước khi hết hạn)
        expiried_services:
          type: integer
          description: Số dịch vụ đã hết hạn
    ChangeTicketAssigneeRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 4000
          description: Lý do từ chối.Tối đa 4000 ký tự.
      required:
        - reason
    UserInfo:
      type:
        - object
        - "null"
      properties:
        id:
          type: integer
          example: 123
          readOnly: true
        name:
          type: string
          example: Nguyen Van A
        mgroup:
          type: string
          description: |
            Phân loại người dùng: 1 = Khách hàng PA, 2 = Đại lý / tài khoản trả trước, 3 = Nhân viên, 4 = Khách hàng đại lý
          enum:
            - "1"
            - "2"
            - "3"
            - "4"
          example: "1"
    GetUserTicketDetailDataConversations:
      type: object
      properties:
        id:
          type: integer
          description: Id cuộc trao đổi
          readOnly: true
        descriptions:
          type: string
          description: Nội dung
        files:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                description: Đường dẫn đến file
              category:
                type: string
                description: "Phân loại:image:Các file ảnhvideo: Các file videodocument: Tài liệu (PDF, Word, Excel, …)archive: File nénother: Loại khác"
          description: Thông tin các tệp tin (xem thêm bên dưới)
        created_date:
          type: string
          description: Ngày tạo (Y-m-d H:i:s)
        owner:
          $ref: "#/components/schemas/UserInfo"
    GetUserTicketDetailData:
      type: object
      properties:
        id:
          type: integer
          description: Id của ticket
          readOnly: true
