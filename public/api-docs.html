<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>P.A DEV API Documentation</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.11.0/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.11.0/favicon-16x16.png" sizes="16x16" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════
       PASTEL THEME - Swagger UI Custom Styling
       ═══════════════════════════════════════════════════════════ */

    * {
      box-sizing: border-box;
    }

    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fef5ff 0%, #f0f9ff 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ── Custom Header Banner ── */
    .custom-header {
      background: linear-gradient(135deg, #e9d5ff 0%, #dbeafe 100%);
      border-bottom: 2px solid #c4b5fd;
      padding: 20px 40px;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.1);
    }

    .custom-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .custom-header p {
      margin: 8px 0 0 0;
      color: #6b7280;
      font-size: 14px;
      font-weight: 400;
    }

    .custom-header .version-badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 12px;
      border: 1px solid #fcd34d;
    }

    /* ── Swagger UI Container ── */
    #swagger-ui {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* ── Info Section ── */
    .swagger-ui .info {
      margin: 30px 0;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.08);
      border: 1px solid #e9d5ff;
    }

    .swagger-ui .info .title {
      font-size: 32px;
      font-weight: 700;
      color: #7c3aed;
      margin-bottom: 12px;
    }

    .swagger-ui .info .description {
      color: #6b7280;
      line-height: 1.7;
      font-size: 15px;
    }

    /* ── Operation Blocks ── */
    .swagger-ui .opblock {
      margin: 20px 0;
      border-radius: 12px;
      border: 2px solid;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .swagger-ui .opblock:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    /* ── HTTP Method Colors (Pastel) ── */
    .swagger-ui .opblock.opblock-get {
      border-color: #a7f3d0;
      background: #f0fdf4;
    }

    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: #6ee7b7;
      color: #065f46;
    }

    .swagger-ui .opblock.opblock-post {
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: #93c5fd;
      color: #1e3a8a;
    }

    .swagger-ui .opblock.opblock-put {
      border-color: #fed7aa;
      background: #fffbeb;
    }

    .swagger-ui .opblock.opblock-put .opblock-summary-method {
      background: #fdba74;
      color: #7c2d12;
    }

    .swagger-ui .opblock.opblock-delete {
      border-color: #fecaca;
      background: #fef2f2;
    }

    .swagger-ui .opblock.opblock-delete .opblock-summary-method {
      background: #fca5a5;
      color: #7f1d1d;
    }

    .swagger-ui .opblock.opblock-patch {
      border-color: #e9d5ff;
      background: #faf5ff;
    }

    .swagger-ui .opblock.opblock-patch .opblock-summary-method {
      background: #d8b4fe;
      color: #581c87;
    }

    /* ── Operation Summary ── */
    .swagger-ui .opblock-summary {
      padding: 16px 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .swagger-ui .opblock-summary:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .swagger-ui .opblock-summary-method {
      font-size: 13px;
      font-weight: 700;
      min-width: 80px;
      padding: 8px 16px;
      text-align: center;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'Fira Code', monospace;
    }

    .swagger-ui .opblock-summary-path {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      font-family: 'Fira Code', monospace;
      flex-grow: 1;
      padding: 0 16px;
    }

    .swagger-ui .opblock-summary-description {
      color: #6b7280;
      font-size: 14px;
    }

    /* ── Parameters & Responses ── */
    .swagger-ui .opblock-body {
      padding: 24px;
      background: white;
    }

    .swagger-ui .parameters-col_description {
      color: #6b7280;
      font-size: 14px;
    }

    .swagger-ui .parameter__name {
      font-weight: 600;
      color: #374151;
      font-family: 'Fira Code', monospace;
    }

    .swagger-ui .parameter__type {
      color: #7c3aed;
      font-size: 12px;
      font-family: 'Fira Code', monospace;
    }

    /* ── Response Tabs ── */
    .swagger-ui .responses-inner {
      padding: 20px;
      background: #f9fafb;
      border-radius: 8px;
    }

    .swagger-ui .response-col_status {
      font-weight: 700;
      font-family: 'Fira Code', monospace;
    }

    .swagger-ui .response-col_status.response-200,
    .swagger-ui .response-col_status.response-201 {
      color: #059669;
    }

    .swagger-ui .response-col_status.response-400,
    .swagger-ui .response-col_status.response-404 {
      color: #dc2626;
    }

    /* ── Code Blocks ── */
    .swagger-ui .highlight-code {
      background: #1e293b;
      border-radius: 8px;
      padding: 16px;
    }

    .swagger-ui .highlight-code pre {
      color: #e2e8f0;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── Models Section ── */
    .swagger-ui .model-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
      border: 2px solid #e9d5ff;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.06);
    }

    .swagger-ui .model-title {
      font-size: 18px;
      font-weight: 600;
      color: #7c3aed;
      margin-bottom: 12px;
    }

    .swagger-ui .model {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
    }

    /* ── Buttons ── */
    .swagger-ui .btn {
      border-radius: 8px;
      font-weight: 600;
      padding: 10px 20px;
      font-size: 14px;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .swagger-ui .btn.execute {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .swagger-ui .btn.execute:hover {
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
      transform: translateY(-2px);
    }

    .swagger-ui .btn.cancel {
      background: #f3f4f6;
      color: #374151;
    }

    .swagger-ui .btn.cancel:hover {
      background: #e5e7eb;
    }

    /* ── Try it out ── */
    .swagger-ui .try-out__btn {
      background: #fef3c7;
      color: #92400e;
      border: 2px solid #fcd34d;
      font-weight: 600;
    }

    .swagger-ui .try-out__btn:hover {
      background: #fde68a;
    }

    /* ── Input Fields ── */
    .swagger-ui input[type=text],
    .swagger-ui input[type=password],
    .swagger-ui input[type=email],
    .swagger-ui textarea,
    .swagger-ui select {
      border: 2px solid #e9d5ff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: 'Fira Code', monospace;
      transition: border-color 0.2s ease;
    }

    .swagger-ui input[type=text]:focus,
    .swagger-ui input[type=password]:focus,
    .swagger-ui input[type=email]:focus,
    .swagger-ui textarea:focus,
    .swagger-ui select:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }

    ::-webkit-scrollbar-thumb {
      background: #c4b5fd;
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a78bfa;
    }

    /* ── Authorization ── */
    .swagger-ui .auth-wrapper {
      background: white;
      border-radius: 12px;
    }

    .swagger-ui .auth-btn-wrapper {
      padding: 16px 0;
    }

    .swagger-ui .authorize {
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .swagger-ui .authorize:hover {
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
      transform: translateY(-2px);
    }

    /* ── Topbar (Hide default) ── */
    .swagger-ui .topbar {
      display: none;
    }

    /* ── Scheme Container ── */
    .swagger-ui .scheme-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      border: 2px solid #e9d5ff;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.06);
    }

    /* ── Fuse.js: style lại filter input của Swagger UI ── */
    .swagger-ui .filter-container {
      padding: 12px 20px;
      background: white;
      border-radius: 12px;
      margin: 0 0 16px 0;
      border: 2px solid #e9d5ff;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.06);
    }

    .swagger-ui .operation-filter-input {
      border: 2px solid #c4b5fd !important;
      border-radius: 10px !important;
      padding: 10px 16px !important;
      font-size: 14px !important;
      font-family: 'Inter', sans-serif !important;
      width: 100% !important;
      background: #faf5ff !important;
      color: #374151 !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
      box-shadow: none !important;
    }

    .swagger-ui .operation-filter-input:focus {
      border-color: #7c3aed !important;
      background: white !important;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12) !important;
      outline: none !important;
    }

    .swagger-ui .operation-filter-input::placeholder {
      color: #a78bfa;
    }
  </style>
</head>

<body>
  <div class="custom-header">
    <h1>P.A DEV API Documentation</h1>
    <p>Internal API Documentation - Support Ticket System</p>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

  <script>
    // Plugin thay thuật toán filter mặc định bằng Fuse.js fuzzy search.
    // Cùng approach với frontend/app/swagger/SwaggerView.tsx.
    var fuseFilterPlugin = function() {
      var fuseOptions = {
        keys: [
          { name: 'operationId', weight: 0.3 },
          { name: 'summary',     weight: 0.25 },
          { name: 'path',        weight: 0.2 },
          { name: 'method',      weight: 0.05 },
          { name: 'tag',         weight: 0.1 },
          { name: 'description', weight: 0.1 }
        ],
        threshold: 0.4,
        ignoreLocation: true,
        useExtendedSearch: true
      };

      return {
        fn: {
          opsFilter: function(taggedOps, phrase) {
            return taggedOps
              .map(function(tagObj, tag) {
                var ops = tagObj.get('operations');
                var entries = ops.toArray().map(function(op) {
                  return {
                    tag: tag,
                    path: op.get('path') || '',
                    method: op.get('method') || '',
                    operationId: op.getIn(['operation', 'operationId']) || '',
                    summary: op.getIn(['operation', 'summary']) || '',
                    description: op.getIn(['operation', 'description']) || ''
                  };
                });
                var fuse = new Fuse(entries, fuseOptions);
                var matched = new Set(fuse.search(phrase).map(function(r) { return r.refIndex; }));
                return tagObj.set(
                  'operations',
                  ops.filter(function(op, i) { return matched.has(i); })
                );
              })
              .filter(function(tagObj) {
                return tagObj.get('operations').size > 0;
              });
          }
        }
      };
    };

    window.onload = function() {
      var parsedSpec = jsyaml.load(`openapi: 3.1.0
info:
  title: PA Vietnam Support API
  version: 1.0.0
  license:
    name: API
  description: API cho hệ thống ticket hỗ trợ khách hàng
  contact:
    name: PA Vietnam
    email: dev@pavietnam.vn
servers:
  - url: https://apigateway.pavietnam.vn
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Ticket
    description: Các API liên quan đến ticket hỗ trợ khách hàng
  - name: Account
    description: Các API liên quan đến tài khoản
paths:
  /v1/departments:
    get:
      summary: Lấy danh sách phòng ban gửi ticket
      operationId: getDepartmentList
      description: API trả về danh sách các phòng ban có quyền gửi ticket trong hệ thống. Dữ liệu được sử dụng để hiển thị lựa chọn phòng ban khi người dùng tạo hoặc lọc ticket.
      tags:
        - Department
      security:
        - bearerAuth: []
      x-permission: ""
      parameters:
        - name: support_company
          in: query
          required: false
          schema:
            type: string
          description: "Các giá trị hợp lệ:"
        - name: id
          in: query
          required: false
          schema:
            type: integer
            default: Id phòng ban
        - name: title
          in: query
          required: false
          schema:
            type: string
            default: Tiêu đề
        - name: name
          in: query
          required: false
          schema:
            type: string
            default: Tên phòng ban
        - name: comment
          in: query
          required: false
          schema:
            type: string
            default: Mô tả/ ghi chú của phòng ban
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - \$ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        \$ref: "#/components/schemas/GetDepartmentListData"
        "400":
          \$ref: "#/components/responses/BadRequest"
        "401":
          \$ref: "#/components/responses/Unauthorized"
        "403":
          \$ref: "#/components/responses/Forbidden"
        "404":
          \$ref: "#/components/responses/NotFound"
        "500":
          \$ref: "#/components/responses/InternalError"
  /v1/orders/{id}/certificates/{certId}/download:
    get:
      summary: Tải xuống chứng chỉ của đơn hàng
      operationId: downloadOrderCertificate
      description: Tải xuống tệp chứng chỉ theo ID đơn hàng và ID chứng chỉ tương ứng. Yêu cầu đơn hàng phải tồn tại và chứng chỉ phải được cấp phát hợp lệ trước khi thực hiện tải xuống.
      tags:
        - Order
      security:
        - bearerAuth: []
      x-permission: ""
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: certId
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: zip
            enum:
              - zip
              - json
          description: zip (default) — trả file ZIP. json — trả JSON với PEM strings.
        - \$ref: "#/components/parameters/IdempotencyKey"
        - \$ref: "#/components/parameters/XRequestId"
        - \$ref: "#/components/parameters/XClientId"
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - \$ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        \$ref: "#/components/schemas/DownloadOrderCertificateData"
            application/zip:
              schema:
                \$ref: "#/components/schemas/BinaryFile"
          headers:
            Cache-Control:
              \$ref: "#/components/headers/CacheControl"
            Content-Disposition:
              \$ref: "#/components/headers/ContentDisposition"
            X-Content-Type-Options:
              \$ref: "#/components/headers/XContentTypeOptions"
        "400":
          \$ref: "#/components/responses/BadRequest"
        "401":
          \$ref: "#/components/responses/Unauthorized"
        "403":
          \$ref: "#/components/responses/Forbidden"
        "404":
          \$ref: "#/components/responses/NotFound"
        "409":
          \$ref: "#/components/responses/Conflict"
        "422":
          \$ref: "#/components/responses/StandardError422"
        "500":
          \$ref: "#/components/responses/InternalError"
      x-error-responses:
        "401":
          - code: 4101
            category: Auth
            message: Thiếu Authorization header
          - code: 4102
            category: Auth
            message: Bearer Token không hợp lệ / hết hạn
        "403":
          - code: 4103
            category: Auth
            message: Client không có scope=admin
          - code: 4108
            category: Auth
            message: IP không được phép
        "404":
          - code: 4001
            category: Not Found
            message: Order không tồn tại, hoặc certificate không thuộc order này
        "409":
          - code: 4090
            category: Idempotency
            message: Idempotency-Key đang xử lý (concurrent)
          - code: 4091
            category: Idempotency
            message: Double submit — payload trùng trong dedup window
        "422":
          - code: 4200
            category: Input
            message: Dữ liệu request không hợp lệ (validate chung)
          - code: 4301
            category: State
            message: Certificate không ở trạng thái ISSUED — không thể download (SUPERSEDED, REVOKED, EXPIRED, REISSUE_QUEUED...)
          - code: 4302
            category: State
            message: certificate_pem rỗng — cert chưa được cấp hoàn chỉnh (provider chưa trả về PEM)
  /v1/services/types:
    get:
      summary: Lấy danh sách các loại dịch vụ hỗ trợ
      operationId: getServiceTypes
      description: API trả về danh sách tất cả các loại dịch vụ hiện có trong hệ thống support, phục vụ cho việc phân loại và định tuyến yêu cầu hỗ trợ của khách hàng. Chỉ các loại dịch vụ đang hoạt động và được kích hoạt mới được trả về trong kết quả.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: ""
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            default: "null"
          description: Không truyền sẽ trả về tất cả loại dịch vụ
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                \$ref: "#/components/schemas/StandardSuccess"
              example:
                success: true
                data: null
                error: null
        "400":
          \$ref: "#/components/responses/BadRequest"
        "401":
          \$ref: "#/components/responses/Unauthorized"
        "403":
          \$ref: "#/components/responses/Forbidden"
        "404":
          \$ref: "#/components/responses/NotFound"
        "500":
          \$ref: "#/components/responses/InternalError"
  /v1/users/{user_id}/services:
    get:
      summary: Lấy danh sách dịch vụ của khách hàng
      operationId: getUserServices
      description: API trả về danh sách tất cả các dịch vụ đang được đăng ký bởi một khách hàng cụ thể dựa trên user_id. Chỉ các dịch vụ thuộc về khách hàng hợp lệ và đang hoạt động trong hệ thống mới được trả về.
      tags:
        - Service
      security:
        - bearerAuth: []
      x-permission: "null"
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Số thứ tự trang muốn hiển thị
        - name: limit
          in: query
          required: false
          schema:
