fields:
  assignee:
    match_type: object
    match_properties: [id, name]
    schema_kind: any           
    ref: "../common/UserInfo.yaml"

  owner:
    match_type: object
    match_properties: [id, name]
    schema_kind: any
    ref: "../common/UserInfo.yaml"

  files:
    match_type: array
    match_item_format: binary
    schema_kind: response      
    ref_type: array_of
    ref: "../common/FileAttachment.yaml"
    
error_codes:
  '4102':
    http_status: '401'
    message: Token không hợp lệ hoặc đã hết hạn
  '4108':
    http_status: '401'
    message: Không có quyền truy cập
  '4004':
    http_status: '404'
    message: Không tìm thấy dữ liệu
  '4200':
    http_status: '422'
    message: Dữ liệu request không hợp lệ
  '4466':
    http_status: '422'
    message: Quá thời hạn cho phép mở lại
  '4467':
    http_status: '422'
    message: Câu hỏi đang được mở
  '4468':
    http_status: '422'
    message: Đang chờ nhân viên tiếp nhận
response_refs:
  '401': ../../components/responses/Unauthorized.yaml
  '403': ../../components/responses/Forbidden.yaml
  '404': ../../components/responses/NotFound.yaml
  '500': ../../components/responses/InternalError.yaml
  '400': ../../components/responses/BadRequest.yaml

request_auto_remove_fields:
  - created_at
  - updated_at

response_readonly_fields:
  - id
  - created_at
  - updated_at