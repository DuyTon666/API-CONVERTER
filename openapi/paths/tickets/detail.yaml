get:
  summary: Xem chi tiết ticket của khách hàng
  operationId: getUserTicketDetail
  description: Hiển thị thông tin chi tiết của một ticket cụ thể cho khách hàng.
    API chỉ trả về ticket thuộc về user_id được chỉ định để đảm bảo quyền truy 
    cập dữ liệu.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/core/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/ticket/GetUserTicketDetailData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '422':
      description: 4200 — Dữ liệu request không hợp lệ
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/core/StandardError.yaml"
