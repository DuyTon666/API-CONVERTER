post:
  summary: Đổi nhân viên được phân công xử lý ticket
  operationId: changeTicketAssignee
  description: Thay đổi nhân viên hỗ trợ được phân công xử lý ticket của người 
    dùng. Chỉ quản lý hoặc người được ủy quyền mới có thể thực hiện thao tác 
    này.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/core/StandardSuccess.yaml"
          example:
            success: true
            data: null
            error: null
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4468 — Đang chờ nhân viên
        tiếp nhận"
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/core/StandardError.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/ticket/ChangeTicketAssigneeRequest.yaml"
