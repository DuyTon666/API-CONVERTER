post:
  summary: Đổi nhân viên được gán xử lý ticket
  operationId: changeTicketAssignee
  description: Thay đổi nhân viên được phân công hỗ trợ cho một ticket cụ thể 
    của người dùng. Chỉ áp dụng cho ticket đang ở trạng thái mở hoặc đang xử lý.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/core/StandardSuccess.yaml"
          example:
            success: true
            data: null
            error: null
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4468 — Đang chờ nhân viên
        tiếp nhận"
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/core/StandardError.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/ticket/ChangeTicketAssigneeRequest.yaml"
