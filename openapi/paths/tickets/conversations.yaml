post:
  summary: Tạo phản hồi ticket khách hàng
  operationId: createTicketConversation
  description: Tạo phản hồi mới cho ticket của khách hàng. API cho phép nhân 
    viên hỗ trợ hoặc hệ thống gửi tin nhắn trả lời cho ticket đang mở.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/core/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/ticket/CreateTicketConversationData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '422':
      description: 4200 — Dữ liệu request không hợp lệ
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/core/StandardError.yaml"
