post:
  summary: API Contract - API tiếp nhận phản ánh góp ý khách hàng 
    (feedback).docx
  operationId: createFeedback
  description: Tiếp nhận phản ánh góp ý (feedback) của khách hàng cho ticket.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh của người dùng.
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh của ticket.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardSuccess.yaml
          example:
            success: true
            data:
            error:
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      description: 4200 — Dữ liệu request không hợp lệ
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardError.yaml
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../../components/schemas/ticket/CreateFeedbackRequest.yaml
  x-manual-edit-fields:
    - description
    - parameters[name=id].description
    - parameters[name=user_id].description
