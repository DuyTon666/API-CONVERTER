post:
  summary: Mở lại ticket đã đóng của khách hàng
  operationId: reopenUserTicket
  description: API cho phép mở lại ticket đã đóng hoặc đã giải quyết của khách hàng. Ticket phải ở trạng thái đóng trước
    khi thực hiện thao tác mở lại, và người dùng phải có quyền truy cập vào ticket tương ứng.
  tags:
  - Ticket
  security:
  - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
  - name: id
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data:
            error:
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: ../../components/responses/StandardError422.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          $ref: "../../components/schemas/ticket/ReopenUserTicketRequest.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
    '409':
    - code: '4466'
      category: ''
      message: Quá thời hạn cho phép mở lại
    - code: '4467'
      category: ''
      message: Câu hỏi đang được mở
