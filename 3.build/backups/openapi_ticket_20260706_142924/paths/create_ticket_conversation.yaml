post:
  summary: Tạo phản hồi ticket cho khách hàng
  operationId: createTicketConversation
  description: API cho phép tạo phản hồi mới trong ticket hỗ trợ của khách hàng. Chỉ người dùng có quyền truy cập ticket
    mới có thể thêm phản hồi vào cuộc hội thoại.
  tags:
  - Ticket
  security:
  - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
  - name: id
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/ticket/CreateTicketConversationData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: ../../components/responses/StandardError422.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    - code: '4463'
      category: ''
      message: Tạo phản hồi thất bại
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
    '409':
    - code: '4464'
      category: ''
      message: Câu hỏi đã đóng, không được thực hiện phản hồi
