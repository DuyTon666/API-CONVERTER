delete:
  summary: Xóa nhà cung cấp theo ID
  operationId: deleteProviderById
  description: Xóa thông tin một nhà cung cấp khỏi hệ thống dựa trên ID được chỉ định. Chỉ quản trị viên có quyền thực 
    hiện thao tác này và nhà cung cấp không thể khôi phục sau khi đã xóa.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/admin/DeleteProviderByIdData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/admin/DeleteProviderByIdRequest.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '5406'
      category: Business
      message: Không thể xóa provider — vẫn còn provider_products active liên kết
    '404':
    - code: '5004'
      category: Not Found
      message: Không tìm thấy provider với id được cho (hoặc đã soft-deleted)
