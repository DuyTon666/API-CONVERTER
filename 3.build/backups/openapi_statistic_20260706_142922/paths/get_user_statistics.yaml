get:
  summary: Lấy thống kê tổng quan cho khách hàng
  operationId: getUserStatistics
  description: API trả về dữ liệu thống kê tổng hợp hiển thị trên trang tổng 
    quan của khách hàng, bao gồm các chỉ số hoạt động quan trọng. Chỉ người dùng
    có quyền hợp lệ mới được phép truy cập thống kê của tài khoản tương ứng với 
    user_id được cung cấp.
  tags:
    - Statistic
  security:
    - bearerAuth: []
  x-permission: CHECK_UPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/statistic/GetUserStatisticsData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
