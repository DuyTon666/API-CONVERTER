type: object
properties:
  id:
    type: integer
    description: Id của dịch vụ
    readOnly: true
  name:
    type: string
    description: Tên dịch vụ (hosting group)
  name_en:
    type: string
    description: Tên dịch vụ tiếng anh
  domain:
    type: string
    description: Tên domain
  service_status:
    type: string
    description: Trạng thái dịch vụ (Trùng với trạng thái status request)
  type_service:
    type: string
    description: Loại dịch vụ nếu có type_service trong extended_fields
  type_service_en:
    type: string
    description: Loại dịch vụ tiếng anh nếu có type_service_en trong
  lifecycle_status:
    type: string
    description: Vòng đời dịch vụ
  expired_date:
    type: string
    description: Ngày hết hạn (Y-m-d H:i:s) nếu có expired_date trong
  auto_renew:
    type: integer
    description: Trạng thái tự động gia hạn nếu có auto_renew trong
  register_date:
    type: string
    description: Ngày đăng ký (Y-m-d H:i:s) sẽ trả giá trị nếu có register_date
  dnssec_status:
    type: string
    description: Trạng thái dnssec sẽ trả giá trị nếu có dnssec_status trong
  owner:
    type: string
    description: Tên chủ thể sẽ trả giá trị nếu có owner trong
  name_package:
    type: string
    description: Tên gói dịch vụ tiếng việt nếu có name_package trong
  name_package_en:
    type: string
    description: Tên gói dịch vụ tiếng anh name_package_en trong
  max_temp_open:
    type: integer
    description: Số lần được phép mở tạm tối đa (trả về khi
  current_temp_open:
    type: integer
    description: Số lần đã mở tạm (trả về khi temporary_service = 1)
  temp_open_day:
    type: integer
    description: Số ngày có thể mở tạm (trả về khi temporary_service = 1)
  allow_temp_open:
    type: integer
    description: '0: Không được phép mở tạm'
  type_code:
    type: string
    description: Mã code loại dịch vụ
