# merge_rules.yaml — config cho conflict_detector và source_merger
merge_rules:
  thresholds:
    auto_resolve: 0.90
    review: 0.50
  source_format_priority:
    docx: 100
    pdf: 80
    txt: 50
    md: 50
  path_priority:
    canonical_module_folder: 100
    source_root: 50
    external_absolute_path: 20
  conflict_types:
    duplicate_import:
      auto_resolve: true
      severity: low
    endpoint_collision:
      auto_resolve: false
      severity: medium
    output_collision:
      auto_resolve: false
      severity: high
    schema_collision:
      auto_resolve: false
      severity: high

source_selection:
  enable: true

  allowed_extensions:
  - .pdf
  - .docx
  - .txt
  - .md

  identity_strategy_order:
  - endpoint
  - normalized_name

  auto_dedup:
    enabled: true
    only_when_different_formats: true
    require_same_endpoint_if_available: true

  filename_normalization:
    strip_extensions:
      - .docx.pdf
      - .docx
      - .pdf
      - .txt
      - .md

    strip_prefix_patterns:
      - "^api contract\\s*-\\s*"
      - "^api ticket\\s*-\\s*"
      - "^api service\\s*-\\s*"
      - "^api statistic\\s*-\\s*"
      - "^api department\\s*-\\s*"

    replace_patterns:
      - patterns: "\\s+"
      - repl: " "

  report:
    path: "3.build/reports/source_selection_report.json"  