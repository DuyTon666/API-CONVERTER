post:
  summary: Tạo sản phẩm nội bộ mới trong hệ thống
  operationId: createInternalProduct
  description: Tạo một sản phẩm nội bộ mới dành cho quản trị viên, sản phẩm này chỉ hiển thị và sử dụng trong phạm vi 
    nội bộ của hệ thống. Yêu cầu quyền admin và các thông tin bắt buộc như tên, mã sản phẩm phải được cung cấp đầy đủ.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters: []
  responses:
    '201':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/admin/CreateInternalProductData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/admin/CreateInternalProductRequest.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '6401'
      category: Unique
      message: code đã tồn tại trong hệ thống
    - code: '6409'
      category: Format
      message: code không hợp lệ — chỉ cho [A-Z0-9_-], 2-64 chars
    - code: '6410'
      category: Business
      message: 'Kết hợp product_type + cert_type không hợp lệ (VD: EV + WILDCARD)'
