post:
  summary: Tiết lộ token xác thực của nhà cung cấp
  operationId: revealProviderToken
  description: API này cho phép quản trị viên xem token xác thực bí mật của một 
    nhà cung cấp cụ thể dựa trên ID. Chỉ những người dùng có quyền admin mới 
    được phép thực hiện thao tác này nhằm đảm bảo bảo mật hệ thống.
  tags:
    - Admin
  security:
    - bearerAuth: []
  x-permission: ''
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/admin/RevealProviderTokenData.yaml"
                  provider_id:
                    type: string
                    readOnly: true
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      $ref: ../../components/responses/StandardError422.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
    '502':
      $ref: ../../components/responses/BadGateway.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/admin/RevealProviderTokenRequest.yaml
  x-error-responses:
    '409':
      - code: '4090'
        category: Idempotency
        message: Idempotency-Key đang xử lý (concurrent)
      - code: '4091'
        category: Idempotency
        message: Double submit — payload trùng trong dedup window
    '401':
      - code: '4101'
        category: Auth
        message: Thiếu Authorization header
      - code: '4102'
        category: Auth
        message: Bearer Token không hợp lệ / hết hạn
      - code: '5407'
        category: Re-auth
        message: Re-authentication thất bại (password sai khi reveal-token)
    '403':
      - code: '4103'
        category: Auth
        message: Client không có scope=admin
      - code: '4108'
        category: Auth
        message: IP không được phép
    '422':
      - code: '4200'
        category: Input
        message: Dữ liệu request không hợp lệ (validate chung)
      - code: '5405'
        category: Business
        message: Provider đã soft-deleted, không thể thao tác
    '404':
      - code: '5004'
        category: Not Found
        message: Không tìm thấy provider với id được cho (hoặc đã soft-deleted)
  x-manual-edit-fields:
    - responses[200].content.application/json.schema.allOf
