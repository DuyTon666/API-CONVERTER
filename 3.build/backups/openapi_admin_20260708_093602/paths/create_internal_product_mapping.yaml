post:
  summary: Tạo ánh xạ cho sản phẩm nội bộ
  operationId: createInternalProductMapping
  description: Tạo mới một ánh xạ liên kết cho sản phẩm nội bộ theo ID được chỉ định. Chỉ quản trị viên có quyền thực 
    hiện thao tác này và sản phẩm phải tồn tại trong hệ thống.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Tham số đường dẫn 'id'.
  responses:
    '201':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/admin/CreateInternalProductMappingData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/admin/CreateInternalProductMappingRequest.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '6502'
      category: Compat
      message: Compatibility mismatch — product_type hoặc cert_type không khớp giữa internal product và provider product
    - code: '6503'
      category: Unique
      message: Internal product này đã có mapping với provider này — không thể map 2 sản phẩm của cùng 1 provider cho 1 
        internal
    - code: '6504'
      category: Business
      message: Provider product không tồn tại / đã xóa / provider đã bị disable hoặc soft-deleted
    - code: '6505'
      category: Unique
      message: Cặp (internal, provider_product) đã được mapping trước đó
    - code: '6506'
      category: Format
      message: routing_weight không hợp lệ — phải là integer trong range [1, 100]
    '404':
    - code: '6004'
      category: Not Found
      message: Internal product không tồn tại (hoặc đã soft-deleted)
