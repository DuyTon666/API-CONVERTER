post:
  summary: Gửi lại email xác thực DCV cho đơn hàng
  operationId: resendDcvEmail
  description: Gửi lại email xác thực kiểm soát tên miền (DCV) cho đơn hàng chỉ 
    định. Chức năng này chỉ áp dụng khi đơn hàng đang chờ xác thực tên miền và 
    email xác thực trước đó chưa được xử lý.
  tags:
    - Order
  security:
    - bearerAuth: []
  x-permission: ''
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data: null
            error: null
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/order/ResendDcvEmailRequest.yaml"
