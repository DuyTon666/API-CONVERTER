get:
  summary: Lấy danh sách đơn hàng của hệ thống
  operationId: getOrderList
  description: API trả về danh sách tất cả đơn hàng trong hệ thống, hỗ trợ lọc 
    theo trạng thái, ngày tạo và khách hàng. Chỉ người dùng có quyền truy cập 
    mới có thể xem thông tin đơn hàng, đảm bảo tính bảo mật và phân quyền trong 
    nghiệp vụ quản lý bán hàng.
  tags:
    - Order
  security:
    - bearerAuth: []
  x-permission: ''
  parameters:
    - name: customer_id
      in: query
      required: false
      schema:
        type: string
    - name: status
      in: query
      required: false
      schema:
        type: string
    - name: product_type
      in: query
      required: false
      schema:
        type: string
    - name: cert_type
      in: query
      required: false
      schema:
        type: string
    - name: domain
      in: query
      required: false
      schema:
        type: string
    - name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: page
      in: query
      required: false
      schema:
        type: integer
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
    - name: sort_by
      in: query
      required: false
      schema:
        type: string
    - name: sort_dir
      in: query
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/order/GetOrderListData.yaml"
                  customer_id:
                    type: string
                    readOnly: true
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      $ref: ../../components/responses/StandardError422.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
    '502':
      $ref: ../../components/responses/BadGateway.yaml
  x-manual-edit-fields:
    - responses[200].content.application/json.schema.allOf
