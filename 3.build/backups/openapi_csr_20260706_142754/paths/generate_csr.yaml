post:
  summary: Tạo yêu cầu ký chứng chỉ CSR mới
  operationId: generateCsr
  description: Tạo một yêu cầu ký chứng chỉ (CSR) mới dựa trên thông tin được 
    cung cấp như tên miền, tổ chức và khóa công khai. Yêu cầu phải đảm bảo đầy 
    đủ các trường bắt buộc và định dạng hợp lệ trước khi gửi đến cơ quan cấp 
    chứng chỉ.
  tags:
    - Csr
  security:
    - bearerAuth: []
  x-permission: ''
  parameters: []
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/csr/GenerateCsrData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/csr/GenerateCsrRequest.yaml"
