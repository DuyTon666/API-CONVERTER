post:
  summary: Mở lại ticket đã đóng của khách hàng
  operationId: reopenTicket
  description: API cho phép mở lại ticket đã đóng hoặc đã giải quyết của khách 
    hàng. Chỉ những ticket ở trạng thái closed hoặc resolved mới có thể được mở 
    lại, và người dùng phải có quyền truy cập vào ticket đó.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data: null
            error: null
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4466 — Quá thời hạn cho phép
        mở lại\n4467 — Câu hỏi đang được mở"
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardError.yaml"
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          $ref: "../../components/schemas/ticket/ReopenTicketRequest.yaml"
