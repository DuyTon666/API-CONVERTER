get:
  summary: Tạo yêu cầu nâng cấp dịch vụ người dùng
  operationId: createServiceUpgradePlanRequest
  description: API cho phép người dùng tạo yêu cầu nâng cấp gói dịch vụ hiện tại
    lên gói cao hơn. Yêu cầu nâng cấp chỉ được thực hiện khi dịch vụ đang hoạt 
    động và người dùng có quyền truy cập hợp lệ.
  tags:
    - Service
  security:
    - bearerAuth: []
  x-permission: CHECK_UPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/service/CreateServiceUpgradePlanRequestData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: 4200 — Dữ liệu request không hợp lệ
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardError.yaml"
