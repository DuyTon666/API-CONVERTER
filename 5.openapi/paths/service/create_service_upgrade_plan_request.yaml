post:
  summary: Tạo yêu cầu nâng cấp gói dịch vụ người dùng
  operationId: createServiceUpgradePlanRequest
  description: API cho phép người dùng tạo yêu cầu nâng cấp gói dịch vụ hiện tại lên gói cao hơn. Yêu cầu được gửi dựa 
    trên ID người dùng và ID dịch vụ cụ thể, cần đảm bảo dịch vụ đang hoạt động trước khi thực hiện nâng cấp.
  tags:
  - Service
  security:
  - bearerAuth: []
  x-permission: CHECK_UPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'user_id'.
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/service/CreateServiceUpgradePlanRequestData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/service/CreateServiceUpgradePlanRequest.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    - code: '5012'
      category: ''
      message: Dịch vụ đã hết hạn
    - code: '5015'
      category: ''
      message: Dịch vụ không hỗ trợ nâng cấp
    - code: '5017'
      category: ''
      message: Dịch vụ mới đã bị tạm khóa
    - code: '5018'
      category: ''
      message: Dịch vụ mới không cùng plan
    - code: '5019'
      category: ''
      message: Dịch vụ mới không hỗ trợ nâng cấp
    - code: '5020'
      category: ''
      message: Chưa cho phép nâng cấp giữa 2 dịch vụ
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
    - code: '5000'
      category: Not Found
      message: Dịch vụ không tìm thấy
    - code: '5008'
      category: Not Found
      message: Không tìm thấy thông tin gói nâng cấp
    '500':
    - code: '5013'
      category: ''
      message: Không xác định được thời hạn còn lại
    - code: '5014'
      category: Not Found
      message: Không lấy được giá của dịch vụ hiện tại
    - code: '5016'
      category: ''
      message: Không lấy được giá của dịch vụ mới
