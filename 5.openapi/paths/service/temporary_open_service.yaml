post:
  summary: Mở tạm thời dịch vụ theo ID
  operationId: temporaryOpenService
  description: API cho phép mở tạm thời một dịch vụ đang bị tạm ngừng dựa trên service_id được cung cấp. Chức năng này 
    áp dụng trong trường hợp khách hàng cần khôi phục dịch vụ tạm thời trong khoảng thời gian cho phép theo quy định 
    nghiệp vụ.
  tags:
  - Service
  security:
  - bearerAuth: []
  x-permission: 'null'
  parameters:
  - name: service_id
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/service/TemporaryOpenServiceData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/service/TemporaryOpenServiceRequest.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    - code: '4481'
      category: ''
      message: Dịch vụ không hỗ trợ mở tạm
    - code: '4482'
      category: ''
      message: Dịch vụ không đủ điều kiện mở tạm
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
    '409':
    - code: '4483'
      category: ''
      message: Thời gian xin gia hạn lần trước vẫn còn. Không thể thực hiện tiếp
