post:
  summary: Đổi mật khẩu dịch vụ của người dùng
  operationId: changeServicePassword
  description: API cho phép đổi mật khẩu của một dịch vụ cụ thể thuộc về người dùng. Người dùng cần cung cấp đúng 
    user_id và id dịch vụ để thực hiện thao tác đổi mật khẩu thành công.
  tags:
  - Service
  security:
  - bearerAuth: []
  x-permission: CHECK_UPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'user_id'.
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data:
            error:
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/service/ChangeServicePasswordRequest.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    - code: '4118'
      category: ''
      message: Chưa bật 2FA
    - code: '5012'
      category: ''
      message: Dịch vụ không hỗ trợ chức năng này
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
    '500':
    - code: '5013'
      category: ''
      message: Xảy ra lỗi trong quá trình đổi mật khẩu
