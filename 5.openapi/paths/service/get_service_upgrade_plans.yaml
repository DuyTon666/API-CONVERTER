get:
  summary: Lấy danh sách gói nâng cấp của dịch vụ
  operationId: getServiceUpgradePlans
  description: API trả về danh sách các gói nâng cấp khả dụng cho một dịch vụ cụ thể của người dùng. Chỉ các dịch vụ 
    đang hoạt động và thuộc sở hữu của user_id hợp lệ mới được phép truy vấn danh sách gói nâng cấp.
  tags:
  - Service
  security:
  - bearerAuth: []
  x-permission: CHECK_UPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'user_id'.
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
