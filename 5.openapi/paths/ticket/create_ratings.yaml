post:
  summary: API Contract - Tạo rating ticket cho khách hàng.docx
  operationId: createRatings
  description: Tạo đánh giá (rating) cho ticket đã hoàn tất của người dùng.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh của người dùng.
    - name: ticket_id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh của ticket.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardSuccess.yaml
          example:
            success: true
            data:
            error:
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4462 — Tạo yêu cầu thất bại\n\
        4469 — Ticket chưa được hoàn tất"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ticket/CreateRatingsRequest.yaml
  x-manual-edit-fields:
    - description
    - parameters[name=ticket_id].description
    - parameters[name=user_id].description
