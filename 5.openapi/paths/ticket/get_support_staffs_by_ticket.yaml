get:
  summary: Lấy danh sách nhân viên hỗ trợ ticket
  operationId: getSupportStaffsByTicket
  description: API trả về danh sách nhân viên hỗ trợ cho một ticket cụ thể của người dùng. Chỉ người dùng sở hữu ticket 
    mới có quyền xem danh sách nhân viên hỗ trợ tương ứng.
  tags:
  - Ticket
  security:
  - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
  - name: id
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "../../components/schemas/ticket/GetSupportStaffsByTicketDataList.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: ../../components/responses/StandardError422.yaml
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
