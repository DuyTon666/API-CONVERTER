post:
  summary: API Contract - API mở lại ticket của khách hàng.docx
  operationId: createReopen
  description: Mở lại ticket đã đóng của khách hàng.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh của người dùng.
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh của ticket.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardSuccess.yaml
          example:
            success: true
            data:
            error:
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4466 — Quá thời hạn cho phép
        mở lại\n4467 — Câu hỏi đang được mở"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardError.yaml
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          $ref: ../../components/schemas/ticket/CreateReopenRequest.yaml
  x-manual-edit-fields:
    - description
    - parameters[name=id].description
    - parameters[name=user_id].description
