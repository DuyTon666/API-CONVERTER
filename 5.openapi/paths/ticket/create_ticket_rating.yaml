post:
  summary: Tạo đánh giá cho ticket của khách hàng
  operationId: createTicketRating
  description: API cho phép khách hàng tạo đánh giá (rating) cho một ticket hỗ trợ cụ thể sau khi ticket đã được xử lý. 
    Mỗi ticket chỉ được phép đánh giá một lần và phải thuộc về đúng người dùng tương ứng với user_id được cung cấp.
  tags:
  - Ticket
  security:
  - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
  - name: ticket_id
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data:
            error:
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: ../../components/responses/StandardError422.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/ticket/CreateTicketRatingRequest.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    - code: '4462'
      category: Insert data
      message: Tạo yêu cầu thất bại
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
    '409':
    - code: '4469'
      category: Input validation
      message: Ticket chưa được hoàn tất
