get:
  summary: Hiển thị danh sách ticket của khách hàng
  operationId: listUserTickets
  description: Lấy danh sách tất cả ticket thuộc về một khách hàng cụ thể dựa trên user_id. Chỉ khách hàng sở hữu tài 
    khoản hoặc quản trị viên mới có quyền xem danh sách ticket này.
  tags:
  - Ticket
  security:
  - bearerAuth: []
  x-permission: CHECK_UPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'user_id'.
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Số thứ tự trang muốn hiển thị
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      default: 10
    description: Tổng số ticket muốn hiển thị trên một trang
  - name: status
    in: query
    required: false
    schema:
      type: string
    description: 'Tìm kiếm theo trạng thái:CREATED: Mới tạoIN_PROGRESS: Đang xử lýPENDING: Chờ phản hồiCLOSED: Đóng'
  - name: keyword
    in: query
    required: false
    schema:
      type: string
    description: 'Nội dung cần tìm kiếm- Tìm kiếm theo: Mã ticket, tiêu đề.- Tối thiểu 4 ký tự'
  - name: date_from
    in: query
    required: false
    schema:
      type: string
      format: date-time
    description: Tìm kiếm từ ngày (Y-m-d H:i:s)- date_to>=data_from
  - name: date_to
    in: query
    required: false
    schema:
      type: string
      format: date-time
    description: Tìm kiếm đến ngày (Y-m-d H:i:s)- date_to>=data_from
  - name: sort_type
    in: query
    required: false
    schema:
      type: string
    description: 'Kiểu sắp xếp:LAST_UPDATED_DESC:Ngày cập nhật giảm dầnCREATED_DATE_DESC: Ngày tạo giảm dần'
  - name: post_by
    in: query
    required: false
    schema:
      type: string
    description: 'Người tạo ticketUSER: user hiện tại (khách hàng)SYSTEM: hệ thống'
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/ticket/ListUserTicketsData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
