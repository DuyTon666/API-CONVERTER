post:
  summary: Tiếp nhận phản ánh góp ý của khách hàng
  operationId: submitTicketFeedback
  description: API tiếp nhận phản ánh và góp ý của khách hàng sau khi xử lý ticket, giúp đánh giá chất lượng dịch vụ. 
    Khách hàng chỉ được gửi feedback cho ticket thuộc về tài khoản của mình và ticket phải ở trạng thái đã hoàn thành.
  tags:
  - Ticket
  security:
  - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
  - name: user_id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'user_id'.
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data:
            error:
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: "../../components/schemas/ticket/SubmitTicketFeedbackRequest.yaml"
  x-error-responses:
    '401':
    - code: '4102'
      category: Auth
      message: Token không hợp lệ / hết hạn
    - code: '4108'
      category: Auth
      message: IP không được phép truy cập
    '422':
    - code: '4200'
      category: Input validation
      message: Dữ liệu request không hợp lệ
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy dữ liệu
