put:
  summary: API Contract - API đóng ticket của khách hàng.docx
  operationId: updateClose
  description: API này cho phép đóng một ticket cụ thể của khách hàng. Thao tác 
    sẽ cập nhật trạng thái ticket sang trạng thái đã đóng.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh duy nhất của người dùng (khách hàng) sở hữu 
        ticket.
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: ID định danh duy nhất của ticket cần được đóng.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardSuccess.yaml
          example:
            success: true
            data:
            error:
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4463 — Tạo phản hồi thất
        bại\n4464 — Câu hỏi đã đóng"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/StandardError.yaml
