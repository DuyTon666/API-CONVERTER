    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4466 — Quá thời hạn cho phép
        mở lại\n4467 — Câu hỏi đang được mở"
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardError.yaml"
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          $ref: "../../components/schemas/ticket/CreateReopenRequest.yaml"
