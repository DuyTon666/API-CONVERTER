post:
  summary: Tạo ticket hỗ trợ cho khách hàng
  operationId: createUserTicket
  description: Tạo một ticket hỗ trợ mới cho khách hàng cụ thể trong hệ thống. 
    API yêu cầu user_id hợp lệ và thông tin ticket bao gồm tiêu đề, mô tả vấn 
    đề.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data: null
            error: null
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4462 — Tạo yêu cầu thất bại"
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardError.yaml"
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: "../../components/schemas/ticket/CreateUserTicketRequest.yaml"
