put:
  summary: Đóng ticket của khách hàng
  operationId: closeUserTicket
  description: API cho phép đóng ticket hỗ trợ của khách hàng khi vấn đề đã được
    giải quyết. Chỉ có thể đóng ticket đang ở trạng thái mở hoặc đang xử lý.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data: null
            error: null
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: "4200 — Dữ liệu request không hợp lệ\n4463 — Tạo phản hồi thất
        bại\n4464 — Câu hỏi đã đóng"
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardError.yaml"
