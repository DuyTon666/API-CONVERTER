get:
  summary: Lấy danh sách nhân viên hỗ trợ ticket
  operationId: listTicketSupportStaffs
  description: Trả về danh sách tất cả nhân viên đang được phân công hỗ trợ và 
    xử lý một ticket cụ thể. API này giúp người dùng biết được ai đang phụ trách
    ticket của mình.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "../../components/schemas/ticket/ListTicketSupportStaffsDataList.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: 4200 — Dữ liệu request không hợp lệ
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardError.yaml"
