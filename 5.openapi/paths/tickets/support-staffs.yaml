get:
  summary: Lấy danh sách nhân viên hỗ trợ ticket
  operationId: getTicketSupportStaffs
  description: Lấy danh sách tất cả nhân viên đang được phân công hỗ trợ một 
    ticket cụ thể. API trả về thông tin các nhân viên hỗ trợ bao gồm vai trò và 
    trạng thái xử lý của họ đối với ticket.
  tags:
    - Ticket
  security:
    - bearerAuth: []
  x-permission: CHECK_NEWUPDATE
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "../../components/schemas/ticket/GetTicketSupportStaffsDataList.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      description: 4200 — Dữ liệu request không hợp lệ
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardError.yaml"
