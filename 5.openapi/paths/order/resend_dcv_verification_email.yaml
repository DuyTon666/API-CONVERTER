post:
  summary: Gửi lại email xác minh DCV cho đơn hàng
  operationId: resendDcvVerificationEmail
  description: Gửi lại email xác minh kiểm soát tên miền (DCV) cho đơn hàng chứng chỉ SSL theo ID. Chức năng này chỉ áp 
    dụng khi phương thức xác minh là email và đơn hàng đang ở trạng thái chờ xác minh.
  tags:
  - Order
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data:
            error:
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/order/ResendDcvVerificationEmailRequest.yaml"
  x-error-responses:
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4108'
      category: Auth
      message: IP không được phép
    - code: '4103'
      category: Auth
      message: Không có quyền
    '404':
    - code: '4001'
      category: Not Found
      message: Order không tồn tại (hoặc đã bị xóa)
    '422':
    - code: '4751'
      category: State
      message: Cert không ở trạng thái PENDING hoặc REISSUE_PENDING
    - code: '4752'
      category: Business
      message: Domain không tồn tại trong dcv_records của cert
    - code: '4757'
      category: Business
      message: Không tìm thấy provider cho đơn hàng
    - code: '4758'
      category: ''
      message: domain là bắt buộc
    - code: '4753'
      category: Business
      message: Domain đang dùng phương thức DCV khác (không phải EMAIL)
    - code: '4754'
      category: Business
      message: Domain đã được xác minh (VALIDATED), không thể gửi lại email
    '502':
    - code: '4852'
      category: Provider
      message: Provider API lỗi khi gửi lại email DCV
