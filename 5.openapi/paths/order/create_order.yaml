post:
  summary: Tạo đơn hàng mới trong hệ thống
  operationId: createOrder
  description: Tạo một đơn hàng mới trong hệ thống với thông tin sản phẩm, số lượng và thông tin khách hàng. Đơn hàng 
    chỉ được tạo thành công khi tồn kho đủ và thông tin thanh toán hợp lệ.
  tags:
  - Order
  security:
  - bearerAuth: []
  x-permission: ''
  parameters: []
  responses:
    '201':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/order/CreateOrderData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    - code: '4502'
      category: Routing
      message: Không acquire được routing lock (concurrent WRR) — client retry sau 1s
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '4221'
      category: Validation
      message: external_account_id là bắt buộc
    - code: '4222'
      category: Validation
      message: external_account_id phải là số nguyên ≥ 1
    - code: '4223'
      category: Validation
      message: customer_id là bắt buộc
    - code: '4224'
      category: Validation
      message: customer_id không được vượt quá 255 ký tự
    - code: '4225'
      category: Validation
      message: internal_product_code là bắt buộc
    - code: '4226'
      category: Validation
      message: internal_product_code không đúng định dạng (^[A-Za-z0-9_-]{2,64}$)
    - code: '4227'
      category: Validation
      message: years là bắt buộc
    - code: '4228'
      category: Validation
      message: years phải là số nguyên ≥ 1
    - code: '4229'
      category: Validation
      message: primary_domain là bắt buộc
    - code: '4230'
      category: Validation
      message: primary_domain không phải FQDN hợp lệ
    - code: '4231'
      category: Validation
      message: note không được vượt quá 500 ký tự
    - code: '4241'
      category: Validation
      message: contact.contact_admin.email không hợp lệ (RFC 5322)
    - code: '4242'
      category: Validation
      message: contact.contact_admin.phone phải theo định dạng E.164
    - code: '4251'
      category: Validation
      message: contact_org.name là bắt buộc khi cung cấp contact_org
    - code: '4252'
      category: Validation
      message: contact_org.address là bắt buộc khi cung cấp contact_org
    - code: '4253'
      category: Validation
      message: contact_org.country là bắt buộc khi cung cấp contact_org
    - code: '4254'
      category: Validation
      message: 'contact_org.country phải là mã ISO 3166-1 alpha-2 (VD: VN, US)'
    - code: '4255'
      category: Validation
      message: contact_org.phone phải theo định dạng E.164
    - code: '4261'
      category: Validation
      message: contact.contact_tech.email không hợp lệ (RFC 5322)
    - code: '4262'
      category: Validation
      message: contact.contact_tech.phone phải theo định dạng E.164
    - code: '4002'
      category: Business
      message: Internal product is_enabled=false — không cho phép tạo order mới
    - code: '4300'
      category: Business
      message: customer_id không tồn tại ở Internal Core
    - code: '4501'
      category: Routing
      message: Không có provider nào khả dụng — NO_PROVIDER_AVAILABLE
    '404':
    - code: '4003'
      category: Not Found
      message: internal_product_code không tồn tại hoặc đã soft-delete
