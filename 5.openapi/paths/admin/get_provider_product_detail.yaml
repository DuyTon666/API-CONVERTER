get:
  summary: Lấy chi tiết sản phẩm của nhà cung cấp
  operationId: getProviderProductDetail
  description: Lấy thông tin chi tiết của một sản phẩm cụ thể thuộc nhà cung cấp dựa trên mã nhà cung cấp và ID sản 
    phẩm. Chỉ quản trị viên có quyền truy cập thông tin này để phục vụ mục đích quản lý và kiểm soát danh mục sản phẩm.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: provider_code
    in: path
    required: true
    schema:
      type: string
    description: Tham số đường dẫn 'provider_code'.
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/admin/GetProviderProductDetailData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  x-error-responses:
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '4409'
      category: Business
      message: Provider không tồn tại hoặc đã bị tắt
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy sản phẩm với id được cho (hoặc đã soft-deleted)
