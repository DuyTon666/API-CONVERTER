delete:
  summary: Xóa sản phẩm của nhà cung cấp
  operationId: deleteProviderProduct
  description: Xóa một sản phẩm cụ thể thuộc nhà cung cấp dựa trên mã nhà cung cấp và ID sản phẩm. Thao tác này chỉ dành
    cho quản trị viên và không thể hoàn tác sau khi thực hiện.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: provider_code
    in: path
    required: true
    schema:
      type: string
  - name: id
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/admin/DeleteProviderProductData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/admin/DeleteProviderProductRequest.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '4409'
      category: Business
      message: Provider không tồn tại hoặc đã bị tắt
    - code: '4407'
      category: Business
      message: Không thể xóa — vẫn còn Order active sử dụng sản phẩm
    '404':
    - code: '4004'
      category: Not Found
      message: Không tìm thấy sản phẩm (hoặc đã soft-deleted trước đó)
