patch:
  summary: Cập nhật thông tin sản phẩm nội bộ
  operationId: updateInternalProduct
  description: Cập nhật thông tin của sản phẩm nội bộ theo ID được chỉ định. Chỉ admin mới có quyền thực hiện thao tác 
    này, và sản phẩm phải tồn tại trong hệ thống.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data:
            error:
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/admin/UpdateInternalProductRequest.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '6402'
      category: ''
      message: Body chứa field immutable (product_type, cert_type, code)
    - code: '6405'
      category: ''
      message: Record tồn tại nhưng đã bị soft-delete
    - code: '6406'
      category: ''
      message: Body không chứa field mutable nào
    - code: '6407'
      category: ''
      message: default_san không phải integer hoặc < 0
    - code: '6408'
      category: ''
      message: max_san không phải integer hoặc < 1
    '404':
    - code: '6004'
      category: ''
      message: id không tồn tại trong DB
