get:
  summary: Lấy danh sách nhà cung cấp trong hệ thống
  operationId: listProviders
  description: Truy xuất danh sách tất cả nhà cung cấp hiện có trong hệ thống dành cho quản trị viên. Chỉ người dùng có 
    quyền admin mới được phép truy cập endpoint này.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Số trang
  - name: per_page
    in: query
    required: false
    schema:
      type: integer
      default: 20
    description: Số record/trang (max 100)
  - name: is_enabled
    in: query
    required: false
    schema:
      type: integer
    description: 'Filter trạng thái: 1=enabled, 0=disabled, không truyền=tất cả'
  - name: search
    in: query
    required: false
    schema:
      type: string
    description: Tìm kiếm LIKE theo code hoặc name. Tối thiểu 2 ký tự.
  - name: sort
    in: query
    required: false
    schema:
      type: string
      default: display_order:asc
    description: 'Format `field:asc|desc`. Các field: display_order, code, name, created_at, updated_at.'
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/admin/ListProvidersData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  x-error-responses:
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
