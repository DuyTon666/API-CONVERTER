patch:
  summary: Bật/tắt trạng thái sản phẩm của nhà cung cấp
  operationId: toggleProviderProductStatus
  description: Thay đổi trạng thái kích hoạt hoặc vô hiệu hóa một sản phẩm cụ 
    thể của nhà cung cấp trong hệ thống. Chỉ quản trị viên có quyền thực hiện 
    thao tác này và sản phẩm phải thuộc đúng nhà cung cấp được chỉ định.
  tags:
    - Admin
  security:
    - bearerAuth: []
  x-permission: ''
  parameters:
    - name: provider_code
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../components/schemas/common/StandardSuccess.yaml
              - type: object
                properties:
                  data:
                    $ref: 
                      ../../components/schemas/admin/ToggleProviderProductStatusData.yaml
                  provider_id:
                    type: string
                    readOnly: true
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '422':
      $ref: ../../components/responses/StandardError422.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
    '502':
      $ref: ../../components/responses/BadGateway.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 
            ../../components/schemas/admin/ToggleProviderProductStatusRequest.yaml
  x-error-responses:
    '409':
      - code: '4090'
        category: Idempotency
        message: Idempotency-Key đang xử lý (concurrent)
      - code: '4091'
        category: Idempotency
        message: Double submit — payload trùng trong dedup window
    '401':
      - code: '4101'
        category: Auth
        message: Thiếu Authorization header
      - code: '4102'
        category: Auth
        message: Bearer Token không hợp lệ / hết hạn
    '403':
      - code: '4103'
        category: Auth
        message: Client không có scope=admin
      - code: '4108'
        category: Auth
        message: IP không được phép
    '422':
      - code: '4200'
        category: Input
        message: Dữ liệu request không hợp lệ (validate chung)
      - code: '4409'
        category: Business
        message: Provider không tồn tại hoặc đã bị tắt
      - code: '4408'
        category: Business
        message: Sản phẩm đã soft-deleted, không thể toggle
    '404':
      - code: '4004'
        category: Not Found
        message: Không tìm thấy sản phẩm
  x-manual-edit-fields:
    - responses[200].content.application/json.schema.allOf
