patch:
  summary: Bật/tắt trạng thái sản phẩm nội bộ
  operationId: toggleInternalProductStatus
  description: Thay đổi trạng thái kích hoạt hoặc vô hiệu hóa của sản phẩm nội bộ theo ID. Chỉ quản trị viên có quyền 
    thực hiện thao tác này và sản phẩm phải tồn tại trong hệ thống.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Tham số đường dẫn 'id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
            - $ref: "../../components/schemas/common/StandardSuccess.yaml"
            - type: object
              properties:
                data:
                  $ref: "../../components/schemas/admin/ToggleInternalProductStatusData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/admin/ToggleInternalProductStatusRequest.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '6405'
      category: Business
      message: Internal product đã soft-deleted, không thể thao tác
    '404':
    - code: '6004'
      category: Not Found
      message: Internal product không tồn tại (hoặc đã soft-deleted)
