patch:
  summary: Cập nhật ánh xạ sản phẩm nội bộ theo ID
  operationId: updateInternalProductMapping
  description: Cập nhật thông tin ánh xạ của một sản phẩm nội bộ dựa trên ID sản phẩm và ID ánh xạ tương ứng. Chỉ quản 
    trị viên có quyền thực hiện thao tác này nhằm đảm bảo tính nhất quán trong việc liên kết sản phẩm nội bộ với các hệ 
    thống bên ngoài.
  tags:
  - Admin
  security:
  - bearerAuth: []
  x-permission: ''
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
    description: Tham số đường dẫn 'id'.
  - name: mapping_id
    in: path
    required: true
    schema:
      type: integer
    description: Tham số đường dẫn 'mapping_id'.
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/StandardSuccess.yaml"
          example:
            success: true
            data:
            error:
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
    '502':
      $ref: "../../components/responses/BadGateway.yaml"
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/admin/UpdateInternalProductMappingRequest.yaml"
  x-error-responses:
    '409':
    - code: '4090'
      category: Idempotency
      message: Idempotency-Key đang xử lý (concurrent)
    - code: '4091'
      category: Idempotency
      message: Double submit — payload trùng trong dedup window
    '401':
    - code: '4101'
      category: Auth
      message: Thiếu Authorization header
    - code: '4102'
      category: Auth
      message: Bearer Token không hợp lệ / hết hạn
    '403':
    - code: '4103'
      category: Auth
      message: Client không có scope=admin
    - code: '4108'
      category: Auth
      message: IP không được phép
    '422':
    - code: '4200'
      category: Input
      message: Dữ liệu request không hợp lệ (validate chung)
    - code: '6506'
      category: Format
      message: routing_weight không hợp lệ — phải là integer trong range [1, 100]
    - code: '6402'
      category: Immutable
      message: Không cho update field immutable (id, code, product_type, cert_type, created_at, created_by)
    '404':
    - code: '6004'
      category: Not Found
      message: Internal product không tồn tại (hoặc đã soft-deleted)
    - code: '6501'
      category: Not Found
      message: Mapping không tồn tại (hoặc đã soft-deleted)
