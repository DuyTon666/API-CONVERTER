get:
  summary: Lấy danh sách phòng ban gửi ticket
  operationId: getDepartmentList
  description: API trả về danh sách các phòng ban có quyền gửi ticket trong hệ 
    thống. Chỉ các phòng ban đang hoạt động và được cấu hình mới được hiển thị 
    trong kết quả trả về.
  tags:
    - Department
  security:
    - bearerAuth: []
  x-permission: ''
  parameters:
    - name: support_company
      in: query
      required: false
      schema:
        type: string
      description: 'Các giá trị hợp lệ:'
  responses:
    '200':
      description: Thành công
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../components/schemas/common/StandardSuccess.yaml"
              - type: object
                properties:
                  data:
                    $ref: "../../components/schemas/department/GetDepartmentListData.yaml"
    '401':
      $ref: "../../components/responses/Unauthorized.yaml"
    '403':
      $ref: "../../components/responses/Forbidden.yaml"
    '404':
      $ref: "../../components/responses/NotFound.yaml"
    '500':
      $ref: "../../components/responses/InternalError.yaml"
    '400':
      $ref: "../../components/responses/BadRequest.yaml"
    '422':
      $ref: "../../components/responses/StandardError422.yaml"
    '409':
      $ref: "../../components/responses/Conflict.yaml"
    '429':
      $ref: "../../components/responses/TooManyRequests.yaml"
