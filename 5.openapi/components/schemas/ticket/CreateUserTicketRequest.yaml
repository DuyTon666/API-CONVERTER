type: object
properties:
  department_id:
    type: integer
    description: Phòng ban muốn được hỗ trợ
  service_id:
    type: integer
    description: Dịch vụ cần hỗ trợ
  title:
    type: string
    description: Tiêu đề
  descriptions:
    type: string
    maxLength: 4000
    description: Nội dung yêu cầu -  Tối đa 4000 ký tự
  files:
    type: array
    items:
      type: string
      format: binary
    maxItems: 3
    description: 'Tệp đính kèm -  Tối đa 3 files -  Tối đa 10MB mỗi file -  Chỉ chấp
      nhận định dạng: .gif, .jpg, .jpeg, .png, .svg, .bmp, .pdf, .zip, .rar'
required:
  - department_id
  - service_id
  - title
  - descriptions
