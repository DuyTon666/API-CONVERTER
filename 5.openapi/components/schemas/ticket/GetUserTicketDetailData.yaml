type: object
properties:
  id:
    type: integer
    description: Id của ticket
    readOnly: true
  title:
    type: string
    description: Tiêu đề
  descriptions:
    type: string
    description: Nội dung yêu cầu hỗ trợ
  code:
    type: string
    description: Mã ticket
  created_date:
    type: string
    description: Ngày ticket được tạo (Y-m-d H:i:s)
  last_updated:
    type: string
    description: Ngày cập nhật gần nhất (Y-m-d H:i:s)
  trangthai:
    type: integer
    description: Trạng thái thực của ticket
  status:
    type: string
    description: 'Trạng thái dành cho FEGồm 4 trạng thái: CREATED: Vừa tạoIN_PROGRESS:
      Đang xử lýPENDING: Chờ phản hồiCLOSED: Đóng'
  files:
    type: array
    items:
      type: object
      properties:
        url:
          type: string
          description: Đường dẫn đến file
        category:
          type: string
          description: 'Phân loại:image:Các file ảnhvideo: Các file videodocument:
            Tài liệu (PDF, Word, Excel, …)archive: File nénother: Loại khác'
    description: Thông tin các tệp tin (xem thêm bên dưới)
  department:
    type: object
    properties:
      id:
        type: integer
        description: Id của phòng ban
        readOnly: true
      name:
        type: string
        description: Tên phòng ban
    description: Thông tin phòng ban xử lý yêu cầu (xem thêm bên dưới)
  service:
    type: object
    properties:
      id:
        type: integer
        description: Id của dịch vụ
        readOnly: true
      domain:
        type: string
        description: Tên domain
      type:
        type: string
        description: Loại dịch vụ
    description: Thông tin về dịch vụ yêu cầu (xem thêm bên dưới)
  assignee:
    type: object
    properties:
      id:
        type: integer
        description: Id của dịch vụ
        readOnly: true
      name:
        type: string
        description: Tên nhân viên
      mgroup:
        type: integer
        description: 'Phân loại người dùng:   1 - Khách hàng PA   2 - Đại lý, tài
          khoản trả trước   3 - Nhân viên   4 - Khách hàng đại lý'
    description: Thông tin về nhân viên hỗ trợ (xem thêm bên dưới)
  conversations:
    type: array
    items:
      $ref: "./GetUserTicketDetailDataConversations.yaml"
    description: Danh sách các phản hồi (xem thêm bên dưới)
