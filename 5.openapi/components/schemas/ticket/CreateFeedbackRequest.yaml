    type: string
    description: Vấn đề bạn gặp phải
  descriptions:
    type: string
    maxLength: 4000
    description: Chi tiết sự việc -  Tối thiểu 20 ký tự -  Tối đa 4000 ký tự
  files:
    type: array
    items:
      type: string
      format: binary
    maxItems: 3
    description: 'Tệp đính kèm -  Tối đa 3 files -  Tối đa 10MB mỗi file -  Chỉ chấp
      nhận định dạng: .gif, .jpg, .jpeg, .png, .svg, .bmp, .pdf, .zip, .rar'
required:
  - title
  - descriptions
