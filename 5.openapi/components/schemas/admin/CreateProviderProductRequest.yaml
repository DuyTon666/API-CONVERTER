type: object
example:
  provider_product_code: '101'
  product_name: PositiveSSL DV Single Domain
  product_name_en: PositiveSSL DV Single Domain
  brand: Sectigo
  product_type: DV
  cert_type: SINGLE
  years_supported: &id001
    - 1
    - 2
  min_san: null
  max_san: null
  supported_dcv_methods: &id002
    - EMAIL
    - HTTP
    - CNAME
  supported_server_types: &id003
    - Apache
    - IIS
    - Nginx
  wholesale_price_usd: 8.5
  retail_price_vnd: 250000
  warranty_amount_usd: 50000
  is_reissue_supported: true
  description: SSL DV Single Domain
  admin_note: Nhập khẩu Daousign tháng 04/2026
  is_enabled: true
  display_order: 10
properties:
  provider_product_code:
    type: string
    description: 'Mã sản phẩm tại provider (VD Daousign: "101", "212"). UNIQUE trong
      phạm vi 1 provider.'
    example: '101'
  product_name:
    type: string
    description: Tên sản phẩm đầy đủ.
    example: PositiveSSL DV Single Domain
    maxLength: 255
  product_name_en:
    type: string
    description: Tên tiếng Anh (nếu có).
    example: PositiveSSL DV Single Domain
  brand:
    type: string
    description: Thương hiệu CA (Sectigo, Comodo, PositiveSSL...).
    example: Sectigo
  product_type:
    type: string
    description: 'Mức xác thực: DV | OV | EV.'
    example: DV
  cert_type:
    type: string
    description: 'Kiểu cert: SINGLE | WILDCARD | MULTI_DOMAIN | FLEX.'
    example: SINGLE
  years_supported:
    type: array
    description: 'Số năm hỗ trợ. VD: [1, 2]. Không rỗng.'
    example: *id001
    minimum: 1
    items:
      type: integer
      example: 1
  min_san:
    type:
      - integer
      - 'null'
    description: Áp dụng MULTI_DOMAIN và FLEX. Mặc định 3.
  max_san:
    type:
      - integer
      - 'null'
    description: 'Áp dụng MULTI_DOMAIN và FLEX. VD: 100.'
  supported_dcv_methods:
    type: array
    description: 'DCV methods: [EMAIL, HTTP, CNAME]. Không rỗng.'
    example: *id002
    items:
      type: string
      example: EMAIL
  supported_server_types:
    type: array
    description: Loại server (Apache, IIS, Nginx...).
    example: *id003
    items:
      type: string
      example: Apache
  wholesale_price_usd:
    type: number
    description: Giá sỉ Daousign (USD/năm).
    example: 8.5
  retail_price_vnd:
    type: number
    description: Giá bán lẻ đề xuất (VND/năm).
    example: 250000
  warranty_amount_usd:
    type: number
    description: Mức bảo hiểm CA (USD).
    example: 50000
  is_reissue_supported:
    type: boolean
    description: Có hỗ trợ reissue không.
    example: true
  description:
    type: string
    description: Mô tả ngắn sản phẩm.
    example: SSL DV Single Domain
  admin_note:
    type: string
    description: Ghi chú nội bộ admin.
    example: Nhập khẩu Daousign tháng 04/2026
  is_enabled:
    type: boolean
    description: Bật/tắt theo chiến lược kinh doanh. true=bán, false=tạm dừng.
    example: true
  display_order:
    type: integer
    description: Thứ tự hiển thị UI (ascending). Mặc định 0.
    example: 10
  id:
    type: string
    description: Primary key nội bộ (UUID v4).
  provider_id:
    type: string
    description: FK tới providers.id — provider sở hữu sản phẩm này.
  max_years:
    type: integer
    description: Tự tính = max(years_supported).
required:
  - provider_product_code
  - product_name
  - product_type
  - cert_type
  - years_supported
  - min_san
  - max_san
description: Schema `CreateProviderProductRequest`.
