type: object
example:
  code: PA-SSL-DV-SINGLE-1Y
  name: SSL DV Single Domain 1 năm
  name_en: SSL DV Single Domain 1 Year
  product_type: DV
  cert_type: SINGLE
  description: Gói SSL cơ bản cho 1 domain
  retail_price_vnd: 250000
  is_enabled: true
  display_order: 10
properties:
  code:
    type: string
    description: Mã nội bộ — admin define lúc tạo. UNIQUE, IMMUTABLE. Regex 
      ^[A-Z0-9_-]{2,64}$ (VD "PA-SSL-DV-SINGLE-1Y").
    example: PA-SSL-DV-SINGLE-1Y
    pattern: ^[A-Z0-9_-]{2,64}$
  name:
    type: string
    description: Tên hiển thị tiếng Việt (≤ 200 ký tự).
    example: SSL DV Single Domain 1 năm
    maximum: 200
  name_en:
    type: string
    description: Tên tiếng Anh (optional, ≤ 200 ký tự).
    example: SSL DV Single Domain 1 Year
    maximum: 200
  product_type:
    type: string
    description: 'Mức xác thực: DV | OV | EV. IMMUTABLE sau create (định danh bản
      chất sản phẩm).'
    enum:
      - DV
      - OV
      - EV
    example: DV
  cert_type:
    type: string
    description: 'Kiểu cert: SINGLE | WILDCARD | MULTI_DOMAIN | FLEX. IMMUTABLE sau
      create.'
    enum:
      - SINGLE
      - WILDCARD
      - MULTI_DOMAIN
      - FLEX
    example: SINGLE
  description:
    type: string
    description: Mô tả hiển thị UI.
    example: Gói SSL cơ bản cho 1 domain
    maximum: 1000
  retail_price_vnd:
    type: number
    description: Giá bán lẻ đề xuất (VND/năm) cho customer UI.
    example: 250000
    minimum: 0
  is_enabled:
    type: boolean
    description: Bật/tắt hiển thị/bán. true = được chọn cho order mới.
    example: true
  display_order:
    type: integer
    description: Thứ tự hiển thị UI (ascending). Mặc định 0.
    example: 10
  id:
    type: string
    description: Primary key UUID v4 — auto generate.
required:
  - code
  - name
  - product_type
  - cert_type
description: Schema `CreateInternalProductRequest`.
