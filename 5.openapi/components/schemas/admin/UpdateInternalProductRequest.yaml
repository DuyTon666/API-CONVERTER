type: object
example:
  name: SSL DV Single Domain (cập nhật)
  name_en: '...'
  description: '...'
  retail_price_vnd: 280000
  is_enabled: true
  display_order: 15
  default_san: 0
  max_san: 10
properties:
  name:
    type: string
    description: Tên hiển thị tiếng Việt (≤ 200 ký tự).
    example: SSL DV Single Domain (cập nhật)
    maximum: 200
  name_en:
    type: string
    description: Tên tiếng Anh (optional, ≤ 200 ký tự).
    example: '...'
  description:
    type: string
    description: Mô tả hiển thị UI.
    example: '...'
  retail_price_vnd:
    type: number
    description: Giá bán lẻ đề xuất (VND/năm) cho customer UI.
    example: 280000
    minimum: 0
  is_enabled:
    type: boolean
    description: Bật/tắt hiển thị/bán. true = được chọn cho order mới.
    example: true
  display_order:
    type: integer
    description: Thứ tự hiển thị UI (ascending). Mặc định 0.
    example: 15
  default_san:
    type:
      - integer
      - 'null'
    description: '>= 0; null = xóa giá trị'
    example: 0
    minimum: 0
  max_san:
    type:
      - integer
      - 'null'
    description: '>= 1; null = xóa giá trị'
    example: 10
    minimum: 1
description: Schema `UpdateInternalProductRequest`.
