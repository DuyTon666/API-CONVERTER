type: object
example:
  is_enabled: true
  reason: Tạm ngưng bán theo quyết định CEO
properties:
  is_enabled:
    type: boolean
    description: Trạng thái mới. true = bật sản phẩm, false = tắt sản phẩm.
    example: true
  reason:
    type: string
    description: Lý do toggle (ghi vào audit log để truy vết sau này). Tối đa 
      500 ký tự.
    example: Tạm ngưng bán theo quyết định CEO
required:
  - is_enabled
description: Schema `ToggleProviderProductStatusRequest`.
