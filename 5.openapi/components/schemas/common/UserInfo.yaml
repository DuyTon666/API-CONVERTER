type: [object, 'null']
properties:
  id:
    type: integer
    example: 123
    readOnly: true
    description: ID định danh duy nhất của người dùng.
  name:
    type: string
    example: Nguyen Van A
    description: Tên hiển thị của người dùng.
  mgroup:
    type: string
    description: >
      Phân loại người dùng:
      1 = Khách hàng PA,
      2 = Đại lý / tài khoản trả trước,
      3 = Nhân viên,
      4 = Khách hàng đại lý
    enum: ['1', '2', '3', '4']
    example: '1'
x-manual-edit-fields:
  - properties.id.description
  - properties.name.description
