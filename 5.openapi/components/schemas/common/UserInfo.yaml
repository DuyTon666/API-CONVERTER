type: ["object", "null"]
description: Thông tin người dùng rút gọn.
properties:
  id:
    type: integer
    description: Định danh người dùng.
    example: 123
    readOnly: true
  name:
    type: string
    description: Tên hiển thị của người dùng.
    example: "Nguyen Van A"
  mgroup:
    type: string
    description: >
      Phân loại người dùng:
      1 = Khách hàng PA,
      2 = Đại lý / tài khoản trả trước,
      3 = Nhân viên,
      4 = Khách hàng đại lý
    enum: ["1", "2", "3", "4"]
    example: "1"