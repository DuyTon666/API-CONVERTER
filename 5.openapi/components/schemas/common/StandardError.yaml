type: object
description: Standard error response wrapper.
required:
  - success
  - error
properties:
  success:
    type: boolean
    const: false
    example: false
    description: Trạng thái thành công của request, luôn là false khi có lỗi.
  error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        description: Internal application error code.
        example: 4200
      message:
        type: string
        description: Human-readable error message.
        example: Dữ liệu không hợp lệ
      data:
        type:
          - object
          - 'null'
        description: Optional error detail payload.
    description: Thông tin chi tiết về lỗi xảy ra.
x-manual-edit-fields:
  - properties.error.description
  - properties.success.description
