# Response cho API nhận lại khi thành công
# Data thay đổi tuỳ vào từng endpoint khác nhau
type: object
description: Response wrapper chuẩn cho API thành công.
required:
  - success
  - error
  - data
properties:
  success:
    type: boolean
    description: Cho biết request đã được xử lý thành công.
    example: true
  error:
    type: ["null"]
    description: Thông tin lỗi, luôn bằng null khi request thành công.
    example: null
  data:
    description: "Dữ liệu trả về tuỳ vào từng endpoint khác nhau"