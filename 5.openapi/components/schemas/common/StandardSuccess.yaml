# Response cho API nhận lại khi thành công
# Data thay đổi tuỳ vào từng endpoint khác nhau
type: object
required:
  - success
  - error
  - data
properties:
  success:
    type: boolean
    example: true
    description: Trạng thái thành công của request.
  error:
    type: ['null']
    example:
    description: Thông tin lỗi, null khi thành công.
  data:
    description: Dữ liệu trả về tuỳ vào từng endpoint khác nhau
x-manual-edit-fields:
