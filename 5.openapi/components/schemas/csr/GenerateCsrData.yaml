type: object
properties:
  csr:
    type: string
    description: CSR PEM đầy đủ. Dùng trực tiếp làm input cho API submit-csr.
  private_key:
    type: string
    description: ⚠️ Private Key PEM (PKCS#8). CHỈ trả về một lần — hệ thống 
      KHÔNG lưu. Client phải lưu ngay.
  common_name:
    type: string
    description: CN ghi vào CSR (echo từ input).
  key_size:
    type: integer
    description: 'Kích thước khoá đã dùng: 2048 | 4096 | 256 | 384.'
  signature_algorithm:
    type: string
    description: 'Thuật toán đã dùng: SHA-256 | SHA-384 | SHA-512.'
  source:
    type: string
    description: '"sslstore" — sinh bởi TheSSLStore API. "internal" — sinh bởi openssl
      nội bộ.'
description: Schema `GenerateCsrData`.
