type: object
properties:
  items:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          description: Order UUID (PK).
          readOnly: true
        order_number:
          type: string
          description: Mã đơn hàng format SSL-YYYY-NNNNNN.
        customer_id:
          type: string
          description: ID khách hàng từ Internal Core System.
          readOnly: true
        internal_product_code:
          type: string
          description: Mã sản phẩm nội bộ (master catalog).
        internal_product_id:
          type: string
          description: Trường `internal_product_id`.
          readOnly: true
        product_type:
          type: string
          description: DV | OV | EV.
        cert_type:
          type: string
          description: SINGLE | WILDCARD | MULTI_DOMAIN | FLEX.
        years:
          type: integer
          description: Số năm đăng ký.
        subscription_start_date:
          type: string
          description: Ngày bắt đầu hiệu lực (YYYY-MM-DD).
        subscription_end_date:
          type: string
          description: Ngày hết hạn (start + years × 366 ngày).
        primary_domain:
          type: string
          description: Domain chính của chứng chỉ.
        san_count:
          type: integer
          description: Số lượng SAN (0 nếu SINGLE/WILDCARD).
        dcv_method:
          type: string
          description: EMAIL | HTTP | CNAME.
        status:
          type: string
          description: Trạng thái hiện tại của order (xem mục 6).
        provider_code:
          type: string
          description: Code của provider đang xử lý order (denormalized để hiển 
            thị nhanh).
        note:
          type:
            - string
            - 'null'
          description: Ghi chú nội bộ. Null nếu không có.
        created_at:
          type: string
          description: Timestamp ISO 8601 UTC.
          readOnly: true
        updated_at:
          type: string
          description: Timestamp ISO 8601 UTC.
          readOnly: true
    description: Mảng các order summary theo bộ lọc và phân trang.
  pagination:
    type: object
    properties:
      page:
        type: integer
        description: Trường `page`.
      per_page:
        type: integer
        description: Trường `per_page`.
      total_items:
        type: integer
        description: Tổng số order thỏa bộ lọc (trước khi phân trang).
      total_pages:
        type: integer
        description: Tổng số trang = ceil(total_items / per_page).
    description: Trường `pagination`.
description: Schema `GetOrderListData`.
