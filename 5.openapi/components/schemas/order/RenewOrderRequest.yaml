type: object
properties:
  years:
    type: integer
    description: Số năm gia hạn. Integer 1–3. Mặc định kế thừa từ order gốc.
  dcv_method:
    type: string
    description: EMAIL | HTTP | HTTPS | CNAME. Mặc định kế thừa từ order gốc.
  contact_admin:
    type: object
    description: Ghi đè contact_admin. Null = kế thừa từ order gốc. Mọi 
      sub-field tùy chọn.
    properties: {}
  contact_admin.email:
    type: string
    description: Email admin (RFC 5322).
  contact_admin.first_name:
    type: string
    description: Tên (≤ 100 ký tự).
  contact_admin.last_name:
    type: string
    description: Họ (≤ 100 ký tự).
  contact_admin.phone:
    type: string
    description: 'Điện thoại E.164 (VD: +84901234567).'
  contact_admin.title:
    type: string
    description: Chức danh (≤ 50 ký tự).
  contact_org:
    type: object
    description: 'Ghi đè contact_org. Null = kế thừa từ order gốc. Nếu cung cấp: name,
      address, country bắt buộc.'
    properties: {}
  contact_org.name:
    type: string
    description: Tên tổ chức (≤ 200 ký tự). *Bắt buộc khi cung cấp contact_org.
  contact_org.address:
    type: string
    description: Địa chỉ (≤ 500 ký tự). *Bắt buộc khi cung cấp contact_org.
  contact_org.province:
    type: string
    description: Tỉnh/thành phố (≤ 100 ký tự).
  contact_org.country:
    type: string
    description: 'Mã quốc gia ISO 3166-1 alpha-2 (VD: VN). *Bắt buộc khi cung cấp
      contact_org.'
  contact_org.postal_code:
    type: string
    description: Mã bưu chính (≤ 20 ký tự).
  contact_org.phone:
    type: string
    description: Điện thoại E.164.
  contact_org.business_number:
    type: string
    description: Mã số thuế / số đăng ký kinh doanh (≤ 50 ký tự).
  contact_org.representative_name:
    type: string
    description: Tên người đại diện (≤ 150 ký tự).
  contact_org.duns:
    type: string
    description: Mã DUNS (≤ 50 ký tự).
  contact_tech:
    type: object
    description: Ghi đè contact_tech. Null = kế thừa từ order gốc. Mọi sub-field
      tùy chọn.
    properties: {}
  contact_tech.email:
    type: string
    description: Email kỹ thuật (RFC 5322).
  contact_tech.first_name:
    type: string
    description: Tên (≤ 100 ký tự).
  contact_tech.last_name:
    type: string
    description: Họ (≤ 100 ký tự).
  contact_tech.phone:
    type: string
    description: Điện thoại E.164.
  contact_tech.title:
    type: string
    description: Chức danh (≤ 50 ký tự).
  note:
    type: string
    description: Ghi chú nội bộ (≤ 1000 ký tự).
required:
  - contact_org.name
  - contact_org.address
  - contact_org.country
