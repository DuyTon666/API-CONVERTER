name: Create API Update PR

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch nền để mở PR vào"
        required: false
        default: "develop"
        type: choice
        options:
          - develop
          - main
      branch_name:
        description: "Branch đã được push sẵn (chứa thay đổi 5.openapi/). Để trống để tự sinh branch mới."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Bundle & Open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # branch: tên branch PR sẽ trỏ tới. Nếu branch_name được truyền vào
      # (route deploy-docs luôn truyền), dùng đúng branch đó — branch này
      # ĐÃ có sẵn commit thật từ route, không được đụng vào lịch sử của nó.
      - name: Resolve source ref
        id: ref
        run: |
          if [ -n "${{ inputs.branch_name }}" ]; then
            echo "ref=${{ inputs.branch_name }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ inputs.branch_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.base_branch }}" >> "$GITHUB_OUTPUT"
            echo "branch=auto/update-openapi-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # =========================
      # Regenerate OpenAPI bundle
      # =========================
      - name: Bundle OpenAPI
        run: npm run bundle:api

      # =========================
      # Commit thêm dist/openapi-bundled.yaml lên ĐÚNG branch đang có
      # (không tạo branch mới, không reset lịch sử cũ) — nếu bundle không
      # đổi gì thì bỏ qua, không tạo commit rỗng.
      #
      # LƯU Ý: không dùng action peter-evans/create-pull-request nữa —
      # action đó tự dựng lại branch từ base + chỉ những file "dirty" tại
      # thời điểm nó chạy, nên sẽ xoá mất commit thật mà route deploy-docs
      # đã tạo sẵn qua Git Data API trước khi dispatch workflow này.
      # =========================
      - name: Commit bundle nếu có thay đổi
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dist/openapi-bundled.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add dist/openapi-bundled.yaml
            git commit -m "chore(openapi): cap nhat bundle tu dong tu Dashboard"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # =========================
      # Chỉ mở PR nếu branch thực sự khác base_branch (có commit thật từ
      # route, hoặc vừa thêm commit bundle ở bước trên) — tránh tạo PR rỗng.
      # =========================
      - name: Kiem tra co gi de mo PR khong
        id: check
        run: |
          git fetch origin "${{ inputs.base_branch }}"
          AHEAD=$(git rev-list --count "origin/${{ inputs.base_branch }}..HEAD")
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.check.outputs.ahead != '0'
        run: git push origin HEAD:refs/heads/${{ steps.ref.outputs.branch }}

      # =========================
      # Mở PR trực tiếp bằng gh CLI — chỉ mở PR từ branch đã có sẵn,
      # không tự sinh lại nội dung branch như action cũ.
      # =========================
      # Ghi body ra FILE thay vì nhét qua ${{ }} vào lệnh shell ở bước sau —
      # nhét text nhiều dòng qua ${{ }} là dán thẳng vào script bash của
      # bước đó, nếu text chứa ký tự đặc biệt (backtick, $, ...) sẽ bị bash
      # hiểu nhầm thành lệnh cần chạy, gây lỗi khó lường.
      - name: Tao PR body
        id: body
        if: steps.check.outputs.ahead != '0'
        env:
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY_FILE="$RUNNER_TEMP/pr_body.md"
          {
            printf '%s\n' 'PR nay duoc tao tu dong khi bam nut "Tao PR" tren Dashboard.'
            printf '\n'
            printf '%s\n' '- Nguon: npm run bundle:api'
            printf -- '- Trigger boi: @%s\n' "$ACTOR"
            printf -- '- Workflow run: %s\n' "$RUN_URL"
            printf '\n'
            printf '%s\n' 'Workflow validate (Spectral lint + oasdiff diff) se tu chay tren PR nay.'
          } > "$BODY_FILE"
          echo "file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Tao hoac lay PR da co
        id: pr
        if: steps.check.outputs.ahead != '0'
        env:
          # Dùng PAT (secret KEY_DEPLOY) thay vì secrets.GITHUB_TOKEN mặc định.
          # GitHub chặn cứng: sự kiện phát sinh (pull_request opened, push từ
          # merge) do chính GITHUB_TOKEN của 1 workflow tạo ra sẽ KHÔNG kích
          # hoạt được workflow khác (chống vòng lặp vô hạn) — trừ
          # workflow_dispatch/repository_dispatch. Vì vậy PR mở/merge bằng
          # GITHUB_TOKEN không bao giờ tự trigger được ci.yaml lẫn
          # deploy.yaml. Dùng PAT thật để các sự kiện này trigger bình thường.
          GH_TOKEN: ${{ secrets.KEY_DEPLOY }}
        run: |
          EXISTING=$(gh pr list --head "${{ steps.ref.outputs.branch }}" --base "${{ inputs.base_branch }}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            NUM=$(gh pr create \
              --base "${{ inputs.base_branch }}" \
              --head "${{ steps.ref.outputs.branch }}" \
              --title "Cap nhat OpenAPI spec tu dong" \
              --label automated --label openapi \
              --body-file "${{ steps.body.outputs.file }}" | grep -oE '[0-9]+$')
            echo "number=$NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Log ket qua
        run: |
          if [ "${{ steps.check.outputs.ahead }}" = "0" ]; then
            echo "Khong co thay doi nao - khong tao PR moi."
          else
            echo "Da mo/cap nhat PR #${{ steps.pr.outputs.number }}"
          fi

      # =========================
      # Bật auto-merge — GitHub sẽ tự merge PR ngay khi mọi required
      # status check (Spectral/oasdiff) pass, không cần bấm tay.
      # Yêu cầu: Settings > General > "Allow auto-merge" đã bật, và
      # branch base có rule "Require status checks to pass".
      # =========================
      - name: Enable auto-merge
        if: steps.check.outputs.ahead != '0' && steps.pr.outputs.number != ''
        env:
          # Dùng PAT (secret KEY_DEPLOY) thay vì secrets.GITHUB_TOKEN mặc định.
          # GitHub chặn cứng: sự kiện phát sinh (pull_request opened, push từ
          # merge) do chính GITHUB_TOKEN của 1 workflow tạo ra sẽ KHÔNG kích
          # hoạt được workflow khác (chống vòng lặp vô hạn) — trừ
          # workflow_dispatch/repository_dispatch. Vì vậy PR mở/merge bằng
          # GITHUB_TOKEN không bao giờ tự trigger được ci.yaml lẫn
          # deploy.yaml. Dùng PAT thật để các sự kiện này trigger bình thường.
          GH_TOKEN: ${{ secrets.KEY_DEPLOY }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --auto --squash --delete-branch
