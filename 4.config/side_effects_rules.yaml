# Rule-based inference cho x-side-effects
# Tool đọc file này trước, chỉ gọi Claude khi rule không đủ chắc

confidence_thresholds:
  emit_yaml:    0.75
  human_review: 0.40

action_verbs:
  - close
  - reopen
  - change
  - submit
  - send
  - resend
  - activate
  - deactivate
  - trigger
  - cancel
  - approve
  - reject
  - verify
  - confirm
  - lock
  - unlock
  - open

notification_keywords:
  - notify
  - notification
  - email
  - sms
  - push
  - broadcast
  - alert

async_keywords:
  - import
  - export
  - sync
  - process
  - generate
  - bulk
  - batch
  - queue

severity_map:
  action_verbs: medium
  notification_keywords: high
  async_keywords: low
# ─── Effect Templates ────────────────────────────────────────────────────────
# Enricher đọc section này để build effects[] trong x-side-effects
# {resource} được resolve theo thứ tự:
#   http_path → filename → operationId → module name → null
effect_templates:

  action_verbs:

    close:
      confidence: 0.85
      effects:
        - type: state_change
          trigger: on_success
          target:
            entity: "{resource}"
            field: status
            from: null
            to: closed
          description: "{resource} chuyển sang trạng thái closed"
          confirmed: false
        - type: write
          trigger: on_success
          target:
            entity: "{resource}_history"
          description: "Ghi lịch sử thao tác {resource}"
          confirmed: false

    reopen:
      confidence: 0.85
      effects:
        - type: state_change
          trigger: on_success
          target:
            entity: "{resource}"
            field: status
            from: null
            to: open
          description: "{resource} chuyển sang trạng thái open"
          confirmed: false
        - type: write
          trigger: on_success
          target:
            entity: "{resource}_history"
          description: "Ghi lịch sử thao tác {resource}"
          confirmed: false

    change:
      confidence: 0.75
      effects:
        - type: state_change
          trigger: on_success
          target:
            entity: "{resource}"
            field: null
            from: null
            to: null
          description: "Thay đổi thuộc tính của {resource}"
          confirmed: false
        - type: write
          trigger: on_success
          target:
            entity: "{resource}_history"
          description: "Ghi lịch sử thay đổi {resource}"
          confirmed: false

    approve:
      confidence: 0.85
      effects:
        - type: state_change
          trigger: on_success
          target:
            entity: "{resource}"
            field: status
            from: null
            to: approved
          description: "{resource} được phê duyệt"
          confirmed: false

    reject:
