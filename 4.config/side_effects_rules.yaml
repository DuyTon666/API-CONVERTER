# ─── Resource Vocabulary ─────────────────────────────────────────────────────
# Danh sách resource hợp lệ trong domain, dùng để normalize kết quả suy luận
# từ path/filename/operationId. Key = dạng số ít (dùng trong {resource} placeholder).
resource_vocabulary:
  ticket:
    - tickets
    - ticket
  service:
    - services
    - service
  department:
    - departments
    - department
  statistic:
    - statistics
    - statistic
  user:
    - users
    - user
