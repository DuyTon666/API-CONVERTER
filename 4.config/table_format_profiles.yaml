# Mỗi profile mô tả 1 kiểu bảng mã lỗi đã từng gặp trong các file nguồn.
# header_match_keywords: TẤT CẢ keyword phải có trong header row thì mới match.
# column_aliases: map từng field chuẩn sang các tên cột có thể gặp trong thực tế.
# Thứ tự profile quan trọng: profile cụ thể hơn (nhiều keyword hơn) phải đứng trước.

profiles:
  - name: "4_have_http"
