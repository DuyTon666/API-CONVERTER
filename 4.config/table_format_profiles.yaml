    header_match_keywords: ["error code", "ngữ cảnh", "mô tả"]
    column_aliases:
      code:     ["error code", "mã lỗi", "code", "error"]
      category: ["ngữ cảnh", "context", "category", "loại", "nhóm"]
      message:  ["mô tả", "description", "message", "nội dung"]

  - name: "2_code_desc_only"
    description: "Bảng 2 cột: Error Code | Mô tả, không có HTTP, không có Ngữ cảnh"
    header_match_keywords: ["error code", "mô tả"]
